name: pytest

on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies and run tests
        shell: bash
        run: |
          uv sync --extra test --extra api
          uv run pytest \
            --junitxml=pytest.xml \
            --cov-report=term-missing:skip-covered \
            --cov=app \
            --cov=classification \
            --cov=extraction \
            --cov=swissgeol_doc_processing \
            --cov=utils \
            tests/ | tee pytest-coverage.txt

      - name: Save PR number
        run: echo ${{ github.event.pull_request.number }} > pr_number.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            pytest-coverage.txt
            pytest.xml
            pr_number.txt
