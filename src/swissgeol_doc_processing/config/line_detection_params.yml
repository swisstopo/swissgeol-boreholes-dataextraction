# Default parameters used for the line detection pipeline, used as part of the swissgeol_doc_processing package
# These paramaters should be changed only if we want to impact the functionality of the package globally.

# Fast Line Detector parameters
fld:
  length_threshold: 10
  distance_threshold: 0.8
  canny_th1: 100
  canny_th2: 150

default_pdf_scale_factor: 2
expected_text_height: 20
max_image_dimension: 10000

line_merging_params:
  # maximum distance between two lines that are merged
  merging_tolerance: 12
  angle_threshold: 5
  min_line_length: 100

diagonals_params:
  angle_threshold: 5