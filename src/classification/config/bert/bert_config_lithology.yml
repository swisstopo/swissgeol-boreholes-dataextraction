classification_system: "lithology"
experiment_name: "lithology"
model_path: "google-bert/bert-base-multilingual-uncased"
use_class_balancing: false
inference_batch_size: 32

# Training and testing sets
training_sets:
  lithology:
    classification_system: lithology
    ground_truths:
      - deepwells_ground_truth.json
      - geoquat_ground_truth.json
      - lithology_ground_truth.json
      - nagra_ground_truth.json
      - thurgau_ground_truth.json
      - zurich_ground_truth.json

test_sets:
  global_lithology:
    classification_system: lithology
    ground_truths:
      - deepwells_ground_truth.json
      - geoquat_ground_truth.json
      - lithology_ground_truth.json
      - nagra_ground_truth.json
      - thurgau_ground_truth.json
      - zurich_ground_truth.json
  deepwells_lithology:
    classification_system: lithology
    ground_truths:
      - deepwells_ground_truth.json
  geoquat_lithology:
    classification_system: lithology
    ground_truths:
      - geoquat_ground_truth.json
  lithology_lithology:
    classification_system: lithology
    ground_truths:
      - lithology_ground_truth.json
  nagra_lithology:
    classification_system: lithology
    ground_truths:
      - nagra_ground_truth.json
  thurgau_lithology:
    classification_system: lithology
    ground_truths:
      - thurgau_ground_truth.json
  zurich_lithology:
    classification_system: lithology
    ground_truths:
      - zurich_ground_truth.json

# Custom Training hyperparameters
hyperparameters:
  batch_size: 32
  learning_rate: 1e-4
  lr_scheduler_type: "cosine_with_restarts"
  max_grad_norm: 5.0
  num_epochs: 32
  warmup_ratio: 0.1
  weight_decay: 0.001

# Layer to train
unfreeze_layers:
  - "classifier"
  - "pooler"
  - "layer_11"
