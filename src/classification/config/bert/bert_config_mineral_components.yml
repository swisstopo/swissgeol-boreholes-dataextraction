classification_system: "mineral_components"
experiment_name: "mineral_components"
model_path: "google-bert/bert-base-multilingual-uncased"
use_class_balancing: true
inference_batch_size: 32

# Training and testing sets
training_sets:
  mineral_components:
    classification_system: mineral_components
    ground_truths:
      - deepwells_ground_truth_enhanced.json
      - geoquat_ground_truth_enhanced.json
      - nagra_ground_truth_enhanced.json
      - zurich_ground_truth_enhanced.json
      - bert_extra/negative_ground_truth.json
      - bert_extra/mineral_components_extra_ground_truth.json

test_sets:
  global_mineral_components:
    classification_system: mineral_components
    ground_truths:
      - deepwells_ground_truth_enhanced.json
      - geoquat_ground_truth_enhanced.json
      - nagra_ground_truth_enhanced.json
      - zurich_ground_truth_enhanced.json
      - bert_extra/negative_ground_truth.json
      - bert_extra/mineral_components_extra_ground_truth.json
  deepwells_mineral_components:
    classification_system: mineral_components
    ground_truths:
      - deepwells_ground_truth_enhanced.json
  geoquat_mineral_components:
    classification_system: mineral_components
    ground_truths:
      - geoquat_ground_truth_enhanced.json
  nagra_mineral_components:
    classification_system: mineral_components
    ground_truths:
      - nagra_ground_truth_enhanced.json
  zurich_mineral_components:
    classification_system: mineral_components
    ground_truths:
      - zurich_ground_truth_enhanced.json
  extra_mineral_components:
    classification_system: mineral_components
    ground_truths:
      - bert_extra/negative_ground_truth.json
      - bert_extra/mineral_components_extra_ground_truth.json

# Custom Training hyperparameters
hyperparameters:
  batch_size: 32
  learning_rate: 1e-4
  lr_scheduler_type: "cosine_with_restarts"
  max_grad_norm: 5.0
  num_epochs: 32
  warmup_ratio: 0.1
  weight_decay: 0.001

# Layer to train
unfreeze_layers:
  - "classifier"
  - "pooler"
  - "layer_11"
