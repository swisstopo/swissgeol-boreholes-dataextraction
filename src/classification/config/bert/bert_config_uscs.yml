classification_system: "uscs"
experiment_name: "uscs"
model_path: "google-bert/bert-base-multilingual-uncased"
use_class_balancing: true
inference_batch_size: 32

# Training and testing sets
training_sets:
  uscs:
    classification_system: uscs
    ground_truths:
      - geoquat_ground_truth.json
      - bert_extra/negative_ground_truth.json
      - bert_extra/uscs_extra_ground_truth.json
      - bert_extra/uscs_counterfeit_ground_truth.json

test_sets:
  global_uscs:
    classification_system: uscs
    ground_truths:
      - geoquat_ground_truth.json
      - bert_extra/negative_ground_truth.json
      - bert_extra/uscs_extra_ground_truth.json
      - bert_extra/uscs_counterfeit_ground_truth.json
  geoquat_uscs:
    classification_system: uscs
    ground_truths:
      - geoquat_ground_truth.json
  extra_uscs:
    classification_system: uscs
    ground_truths:
      - bert_extra/negative_ground_truth.json
      - bert_extra/uscs_extra_ground_truth.json
      - bert_extra/uscs_counterfeit_ground_truth.json

# Custom Training hyperparameters
hyperparameters:
  batch_size: 32
  learning_rate: 1e-4
  lr_scheduler_type: "cosine_with_restarts"
  max_grad_norm: 5.0
  num_epochs: 32
  warmup_ratio: 0.1
  weight_decay: 0.001

# Layer to train
unfreeze_layers:
  - "classifier"
  - "pooler"
  - "layer_11"
