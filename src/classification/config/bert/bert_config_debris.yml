classification_system: "debris"
experiment_name: "debris"
model_path: "google-bert/bert-base-multilingual-uncased"
use_class_balancing: false

# Training and testing sets
training_sets:
  debris:
    classification_system: debris
    ground_truths:
      - geoquat_ground_truth.json
      - deepwells_ground_truth.json

test_sets:
  debris:
    classification_system: debris
    ground_truths:
      - geoquat_ground_truth.json
      - deepwells_ground_truth.json

# Custom Training hyperparameters
hyperparameters:
  batch_size: 32
  learning_rate: 1e-4
  lr_scheduler_type: "cosine_with_restarts"
  max_grad_norm: 5.0
  num_epochs: 32
  warmup_ratio: 0.1
  weight_decay: 0.001

# Layer to train
unfreeze_layers:
  - "classifier"
  - "pooler"
  - "layer_11"
