classification_system: "en_secondary_rank"
experiment_name: "en_secondary_rank"
model_path: "google-bert/bert-base-multilingual-uncased"
use_class_balancing: false
inference_batch_size: 32

# Training and testing sets
training_sets:
  en_secondary_rank:
    classification_system: en_secondary_rank
    ground_truths:
      - deepwells_ground_truth.json
      - geoquat_ground_truth.json
      - nagra_ground_truth.json
      - thurgau_ground_truth.json
      - zurich_ground_truth.json

test_sets:
  global_en_secondary_rank:
    classification_system: en_secondary_rank
    ground_truths:
      - deepwells_ground_truth.json
      - geoquat_ground_truth.json
      - nagra_ground_truth.json
      - thurgau_ground_truth.json
      - zurich_ground_truth.json
  deepwells_en_secondary_rank:
    classification_system: en_secondary_rank
    ground_truths:
      - deepwells_ground_truth.json
  geoquat_en_secondary_rank:
    classification_system: en_secondary_rank
    ground_truths:
      - geoquat_ground_truth.json
  nagra_en_secondary_rank:
    classification_system: en_secondary_rank
    ground_truths:
      - nagra_ground_truth.json
  thurgau_en_secondary_rank:
    classification_system: en_secondary_rank
    ground_truths:
      - thurgau_ground_truth.json
  zurich_en_secondary_rank:
    classification_system: en_secondary_rank
    ground_truths:
      - zurich_ground_truth.json

# Custom Training hyperparameters
hyperparameters:
  batch_size: 32
  learning_rate: 1e-4
  lr_scheduler_type: "cosine_with_restarts"
  max_grad_norm: 5.0
  num_epochs: 32
  warmup_ratio: 0.1
  weight_decay: 0.001

# Layer to train
unfreeze_layers:
  - "classifier"
  - "pooler"
  - "layer_11"
