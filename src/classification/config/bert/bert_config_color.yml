model_path: "google-bert/bert-base-multilingual-uncased"

# Dataset slices used for a default single-run experiment.
# Run `boreholes-train-color train --list-slices` to see all available slices.
train_slices:
  - "ZH-conso"
  - "GQ-conso"
  - "TH-conso"
  - "DW-conso"
  - "NA-conso"
test_slices:
  - "ZH-unconso"
  - "GQ-unconso"
  - "TH-unconso"
  - "DW-unconso"
  - "NA-unconso"
name: "conso_to_unconso"

# Training hyperparameters (mirrors bert_config_lithology.yml)
batch_size: 32
num_epochs: 32
learning_rate: 3.0e-3
weight_decay: 0.001
warmup_ratio: 0.1
lr_scheduler_type: "cosine_with_restarts"
max_grad_norm: 5.0
max_length: 128
unfreeze_layers:
  - "classifier"
  - "pooler"
  - "layer_11"
use_class_balancing: false

# Inference parameters
inference_batch_size: 32
