classification_system: "accessory_components"
experiment_name: "accessory_components"
model_path: "google-bert/bert-base-multilingual-uncased"
use_class_balancing: false
inference_batch_size: 32

# Training and testing sets
training_sets:
  accessory_components:
    classification_system: accessory_components
    ground_truths:
      - deepwells_ground_truth_enhanced.json
      - geoquat_ground_truth_enhanced.json
      - zurich_ground_truth_enhanced.json
      - nagra_ground_truth_enhanced.json


test_sets:
  global_accessory_components:
    classification_system: accessory_components
    ground_truths:
      - deepwells_ground_truth_enhanced.json
      - geoquat_ground_truth_enhanced.json
      - zurich_ground_truth_enhanced.json
      - nagra_ground_truth_enhanced.json
  deepwells_accessory_components:
    classification_system: accessory_components
    ground_truths:
      - deepwells_ground_truth_enhanced.json
  geoquat_accessory_components:
    classification_system: accessory_components
    ground_truths:
      - geoquat_ground_truth_enhanced.json

  zurich_accessory_components:
    classification_system: accessory_components
    ground_truths:
      - zurich_ground_truth_enhanced.json
  nagra_accessory_components:
    classification_system: accessory_components
    ground_truths:
      - nagra_ground_truth_enhanced.json

# Custom Training hyperparameters
hyperparameters:
  batch_size: 32
  learning_rate: 1e-4
  lr_scheduler_type: "cosine_with_restarts"
  max_grad_norm: 5.0
  num_epochs: 32
  warmup_ratio: 0.1
  weight_decay: 0.001

# Layer to train
unfreeze_layers:
  - "classifier"
  - "pooler"
  - "layer_11"
