  #     and compound forms: "Mittel-Grobkies", "mittel- bis grobkiesig",
  #     "gravier moyen à grossier", "medium to coarse gravel".

  #   10. RANGE / COMPOUND CONSTITUENT NAMES
  #     Where German or French names two adjacent grain-size fractions as one
  #     combined population, assign the single matching combined class — do NOT
  #     split it into two separate single-fraction classes:
  #       "Fein-Mittelsand" / "fein- bis mittelsandig"  → fmsa (not fsa + msa)
  #       "Mittel-Grobkies" / "mittel- bis grobkiesig"  → mcgr (not mgr + cgr)

  #   11. NO ns OR oth CLASS
  #     These classes must never appear in the output. Every description names
  #     at least one constituent. If truly no constituent can be identified,
  #     return the single class that best matches the closest named material.
  #   </rules>