# Config file for alteration degree classification (unconsolidated material only)
# Prompt file and version
prompts_file: bedrock/prompts/alteration_degree_unconso_prompts.yml
prompt_version: baseline

# Pattern file and parameter version
pattern_file: bedrock/examples/alteration_degree_unconso_classification_patterns_bedrock.yml
pattern_version: baseline

# Tool file
tool_file: bedrock/tool/tool_classify_texts.yml

# temperature - answer creativity for the LLM model
temperature: 0.0

# Maximum response tokens
max_tokens: 4096

# Parameter indicating if Reasoning (Chain of Thought) mode should be used. Warning this significantly increases latency
reasoning_mode: False

# Parameter indicating if multi-label classification should be used (one description can yield multiple labels)
multilabel_mode: False
