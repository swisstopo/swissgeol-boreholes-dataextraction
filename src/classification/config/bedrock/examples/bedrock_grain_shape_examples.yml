baseline: |
  not_specified:
    description:
      No grain shape information is present or inferable. Use when the
      description contains no explicit reference to grain form or morphology
      — neither flat, elongated, equidimensional, nor any synonym. Texture,
      colour, plasticity, angularity, or compactness descriptions without
      any shape qualifier stay here. Never combine not_specified with any
      other class.
    keywords:
      de: [keine Angabe, unbekannt, nicht beschrieben]
      fr: [sans indication]
      it: [non specificato]
      en: [not specified]

  cubic:
    description:
      Cubic — grains that are roughly equidimensional in all three axes:
      neither flat nor elongated. Also described as blocky, compact, or
      isometric. The primary German signal is "kubisch" used alone or in
      compound form. Also triggered by "gedrungen" (stocky/compact) and
      "rund" when used explicitly as a shape descriptor (distinct from
      "rund" as an angularity term — here it describes the overall blocky
      form). Compound forms "kubisch-plattig" and "plattig-kubisch" trigger
      both cubic and platy. "Gerundet-kubisch" and "kubisch-gerundet" also
      trigger cubic (shape) alongside the angularity class. Use cubic when
      the description indicates grains are roughly as wide as they are long
      and thick.
    keywords:
      de: [kubisch, kubisch-plattig, plattig-kubisch, kubisch-gerundet, gerundet-kubisch, kubisch bis flach, gedrungen, Kornform kubisch, Komponenten kubisch]
      fr: [cubique, isométrique, équidimensionnel]
      it: [cubico, isometrico]
      en: [cubic, blocky, equidimensional]

  elongated:
    description:
      Elongated — grains that are distinctly longer in one axis than in the
      other two: rod-like, prismatic, or needle-shaped. The primary German
      signal is "stengelig" (rod-like, columnar) and its compound forms
      "plattig, stengelig" (platy and elongated). Use elongated when the
      description indicates grains are noticeably longer than wide. When
      "stengelig" co-occurs with "plattig", assign both elongated and platy.
    keywords:
      de: [stengelig, stengeliger, z.T. stengelig, Kornform stengelig]
      fr: [allongé, prismatique, en bâtonnet]
      it: [allungato, prismatico]
      en: [elongated, rod-like, prismatic]

  platy:
    description:
      Platy — grains that are distinctly flat: one dimension (thickness)
      is much smaller than the other two. Includes tabular, disc-shaped,
      and lamellar forms. The primary German signals are "flach" (flat),
      "plattig" (platy/tabular), "abgeplattet" (flattened), "abgeflacht"
      (flattened), "Platten" (slabs), and "Platte" (slab/plate). Compound
      forms "kubisch-plattig" and "plattig-kubisch" trigger both platy and
      cubic. "Plattig, stengelig" triggers both platy and elongated.
      "Gefüge plattig" (platy fabric/structure) also qualifies. Use platy
      when the description explicitly indicates flat, disc-like, or tabular
      grain form.
    keywords:
      de: [flach, plattig, abgeplattet, abgeflacht, Platte, Platten, Steinplatten, Sandsteinplatte, flache Steine, Korn flach, kubisch-plattig, plattig-kubisch, kubisch bis flach, gerundet kubisch bis flach, Gefüge plattig, Kornform plattig]
      fr: [plat, aplati, tabulaire, en dalles, feuilleté]
      it: [piatto, appiattito, tabulare]
      en: [platy, flat, tabular, disc-shaped]
