baseline: |
  fresh:
    description:
      Unconsolidated material showing no visible signs of chemical or physical
      weathering; mineral grains retain original colour and lustre, no
      discolouration, no softening, and no loss of structure. Indicates
      minimal post-depositional alteration.
    keywords:
      de: [frisch, unverwittert, nicht verwittert, unverändert]
      fr: [frais, fraîche, non altéré, non altérée, intact]
      it: [fresco, fresca, non alterato, non alterata, integro]

  slightly_weathered:
    description:
      Unconsolidated material with minor signs of weathering; slight
      discolouration along grain surfaces or pore walls, occasional
      rust staining, but grains are still largely intact and the deposit
      retains most of its original fabric.
    keywords:
      de: [schwach verwittert, leicht verwittert, gering verwittert, wenig verwittert]
      fr: [légèrement altéré, légèrement altérée, faiblement altéré, peu altéré]
      it: [debolmente alterato, debolmente alterata, leggermente alterato, poco alterato]

  moderately_weathered:
    description:
      Unconsolidated material with moderate weathering; noticeable
      discolouration of grains, partial oxidation, some softening of
      reactive minerals, and moderate loss of original fabric coherence.
      The deposit is clearly altered but still identifiable.
    keywords:
      de: [mässig verwittert, mittel verwittert, mittelmässig verwittert, mäßig verwittert]
      fr: [modérément altéré, modérément altérée, moyennement altéré]
      it: [moderatamente alterato, moderatamente alterata, mediamente alterato]

  weathered:
    description:
      Unconsolidated material with significant weathering; pronounced
      discolouration throughout, widespread oxidation, softening of
      minerals, and substantial loss of original fabric. Most grains
      are visibly altered but the deposit has not completely broken down.
    keywords:
      de: [verwittert, verändert, zersetzt, stark verändert]
      fr: [altéré, altérée, décomposé, décomposée]
      it: [alterato, alterata, decomposto, decomposta]

  highly_weathered:
    description:
      Unconsolidated material with advanced weathering; most grains are
      strongly discoloured, oxidised, or chemically transformed; original
      fabric is largely destroyed and the material is soft, friable, or
      earthy. Only relict structures allow identification of the original
      deposit.
    keywords:
      de: [stark verwittert, hoch verwittert, stark zersetzt, tief verwittert]
      fr: [très altéré, très altérée, fortement altéré, fortement décomposé]
      it: [molto alterato, molto alterata, fortemente alterato, fortemente decomposto]

  completely_weathered:
    description:
      Unconsolidated material completely transformed by weathering; original
      grain identity and deposit structure are entirely lost. The material
      has been converted to residual soil, clay, or oxide minerals. No
      unaltered grains remain.
    keywords:
      de: [vollständig verwittert, vollkommen verwittert, komplett verwittert, total verwittert]
      fr: [complètement altéré, complètement altérée, totalement altéré, entièrement décomposé]
      it: [completamente alterato, completamente alterata, totalmente alterato, interamente decomposto]

  other:
    description:
      Alteration state that does not fit any of the defined categories.
      Use only when a weathering or alteration condition is clearly described
      but genuinely falls outside the fresh–completely_weathered spectrum.
    keywords:
      de: [andere, sonstige, übrige]
      fr: [autre, autres]
      it: [altro, altri]

  not_specified:
    description:
      No alteration degree information is provided or inferable from the
      text. Use when the description is absent, illegible, or entirely
      ambiguous. Do not use as a fallback when weathering can be reasonably
      inferred.
    keywords:
      de: [keine Angabe, nicht angegeben, unbekannt, k.A.]
      fr: [sans indication, non spécifié, inconnu]
      it: [senza indicazioni, non specificato, sconosciuto]
