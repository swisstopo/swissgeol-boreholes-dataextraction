baseline: |
  not_specified:
    description:
      No mineral component can be identified from the description, or the
      description does not mention any accessory mineral. Use when no specific
      mineral is present or inferable.
    keywords:
      de: [keine Angabe, unbekannt, nicht beschrieben, k.A.]
      fr: [non spécifié, sans indication, inconnu]
      it: [non specificato, senza indicazioni, sconosciuto]

  actinolite:
    description:
      Calcium magnesium iron inosilicate of the amphibole group forming green
      to grey-green bladed or fibrous crystals; characteristic of greenschist-
      facies metamorphic rocks and hydrothermally altered mafic rocks.
    keywords:
      de: [Aktinolith, Aktinolite, Strahlstein]
      fr: [actinote, actinolite]
      it: [actinolite, actinolito]

  adularia:
    description:
      Low-temperature variety of potassium feldspar (monoclinic KAlSi₃O₈)
      forming colourless to white pseudorhombic crystals; typical of hydrothermal
      veins and low-grade metamorphic terrains (Adular type locality: Adula Alps).
    keywords:
      de: [Adular, Adularia]
      fr: [adulaire, feldspath adulaire]
      it: [adularia]

  albite:
    description:
      Sodium end-member of the plagioclase feldspar series (NaAlSi₃O₈); white
      to colourless, common in granites, pegmatites, low-grade metamorphic rocks,
      and as an alteration product of other feldspars (albitisation).
    keywords:
      de: [Albit, Natronfeldspat]
      fr: [albite, feldspath sodique]
      it: [albite, feldspato sodico]

  almandine:
    description:
      Iron-aluminium end-member of the garnet group (Fe₃Al₂Si₃O₁₂); deep red
      to brownish-red dodecahedral crystals common in amphibolite-facies
      metapelites, micaschists, and gneisses.
    keywords:
      de: [Almandin, Almandingranate, Almandin-Granat]
      fr: [almandin, grenat almandin]
      it: [almandino, granato almandin]

  amphibole:
    description:
      Group of double-chain inosilicate minerals including hornblende, actinolite,
      tremolite, and glaucophane; occur in igneous and metamorphic rocks. Use
      this general term when the specific amphibole species cannot be determined.
    keywords:
      de: [Amphibol, Amphibole, Hornblende-Gruppe]
      fr: [amphibole, amphiboles]
      it: [anfibolo, anfiboli]

  andalusite:
    description:
      Aluminium silicate polymorph (Al₂SiO₅) stable at low to medium pressure;
      occurs as coarse pink to white prismatic crystals in thermally metamorphosed
      pelitic rocks (hornfels, schists). The variety chiastolite shows a cross-
      shaped carbon inclusion pattern.
    keywords:
      de: [Andalusit, Chiastolith]
      fr: [andalousite, chiastolite]
      it: [andalusite, chiastolite]

  andesine:
    description:
      Intermediate plagioclase feldspar (An₃₀–An₅₀) between albite and anorthite;
      characteristic mineral of andesites, diorites, and amphibolites. Typically
      white to grey with polysynthetic twinning.
    keywords:
      de: [Andesin, Andesin-Feldspat]
      fr: [andésine, plagioclase andésine]
      it: [andesina, plagioclasio andesinico]

  anhydrite:
    description:
      Anhydrous calcium sulphate (CaSO₄); white to grey massive or granular
      mineral found in evaporite sequences and hydrothermal veins. Converts to
      gypsum by hydration, causing volume increase and ground heave.
    keywords:
      de: [Anhydrit, wasserfreier Gips]
      fr: [anhydrite]
      it: [anidrite]

  ankerite:
    description:
      Calcium iron magnesium carbonate Ca(Fe,Mg,Mn)(CO₃)₂ of the dolomite group;
      yellowish to brownish rhombohedral crystals occurring in hydrothermal veins,
      carbonatite-related deposits, and iron-formation diagenesis.
    keywords:
      de: [Ankerit, Eisendolomit]
      fr: [ankérite, ankérite ferreux]
      it: [ankerite, ankerite ferrifera]

  anorthite:
    description:
      Calcium end-member of the plagioclase feldspar series (CaAl₂Si₂O₈); white
      to grey, found in mafic and ultramafic igneous rocks, some metamorphic
      rocks, and calcium-rich granulites.
    keywords:
      de: [Anorthit, Kalziumfeldspat]
      fr: [anorthite, feldspath calcique]
      it: [anortite, feldspato calcico]

  anorthoclase:
    description:
      Sodium-potassium feldspar with high Na content ((Na,K)AlSi₃O₈), triclinic;
      occurs as white to colourless crystals in sodium-rich volcanic rocks
      (trachytes, phonolites) and some metamorphic terrains.
    keywords:
      de: [Anorthoklas]
      fr: [anorthoclase]
      it: [anortoclasio]

  anthracite:
    description:
      Highest-rank coal with >91% fixed carbon and high lustre; found in highly
      metamorphosed coal-bearing sequences. As an accessory mineral component
      it appears as shiny black fragments or blebs in metamorphic rocks.
    keywords:
      de: [Anthrazit, Anthrazitkohle]
      fr: [anthracite]
      it: [antracite]

  antigorite:
    description:
      Platy variety of serpentine group mineral Mg₃Si₂O₅(OH)₄; forms by
      metamorphic hydration of olivine and pyroxene at intermediate temperatures.
      Occurs as green to grey lamellar sheets in serpentinites and ophiolites.
    keywords:
      de: [Antigorit, Blätterserpentin]
      fr: [antigorite, serpentine lamelleuse]
      it: [antigorite, serpentino lamellare]

  apatite:
    description:
      Calcium phosphate mineral group Ca₅(PO₄)₃(F,Cl,OH); colourless, yellow,
      or green hexagonal crystals; ubiquitous accessory mineral in igneous,
      metamorphic, and sedimentary rocks. Important for U–Pb and fission-track
      thermochronology.
    keywords:
      de: [Apatit, Fluorapatit, Hydroxylapatit]
      fr: [apatite, fluorapatite]
      it: [apatite, fluorapatite]

  aragonite:
    description:
      Orthorhombic polymorph of calcium carbonate (CaCO₃); metastable at surface
      conditions, converting to calcite over time. Found in high-pressure
      metamorphic rocks, mollusc shells, coral skeletons, and speleothems.
    keywords:
      de: [Aragonit]
      fr: [aragonite]
      it: [aragonite]

  arsenopyrite:
    description:
      Iron arsenic sulphide (FeAsS); silver-white to steel-grey metallic mineral
      with a distinctive garlic-like smell when struck. Common accessory in
      hydrothermal gold deposits and metamorphic sulphide assemblages.
    keywords:
      de: [Arsenopyrit, Arsenkies, Arsenopyrite]
      fr: [arsénopyrite, arsénopyrite, mispickel]
      it: [arsenopirite, mispickel]

  asbestos:
    description:
      Fibrous silicate minerals (chrysotile, actinolite, tremolite, anthophyllite,
      amosite, crocidolite) with asbestiform habit; occur in ultramafic rocks,
      metamorphic terrains, and hydrothermal veins. Use when fibrous habit is
      noted but specific species is not identified.
    keywords:
      de: [Asbest, asbestförmige Fasern, Asbestfasern]
      fr: [amiante, fibres d'amiante, asbeste]
      it: [amianto, asbesto, fibre di amianto]

  augite:
    description:
      Calcium iron magnesium pyroxene (Ca,Mg,Fe,Al)₂(Si,Al)₂O₆; black to dark
      green prismatic crystals; the most common pyroxene in mafic igneous rocks
      (basalt, gabbro, dolerite) and some metamorphic rocks.
    keywords:
      de: [Augit, Augitpyroxen]
      fr: [augite, pyroxène augitique]
      it: [augite, pirosseno augitico]

  baryte:
    description:
      Barium sulphate (BaSO₄); heavy white to colourless tabular crystals
      (specific gravity ~4.5); common gangue mineral in hydrothermal veins and
      as concretions in sedimentary rocks. Also spelled barite.
    keywords:
      de: [Baryt, Schwerspat, Barytit]
      fr: [barytine, baryte, sulfate de baryum]
      it: [barite, baritina]

  bauxite:
    description:
      Mixture of aluminium hydroxide minerals (gibbsite, boehmite, diaspore)
      with iron oxides and clay; formed by intense lateritic weathering of
      aluminium-rich rocks in tropical climates. Appears as earthy reddish to
      yellowish material.
    keywords:
      de: [Bauxit, Aluminiumhydroxid-Gemisch]
      fr: [bauxite]
      it: [bauxite]

  biotite:
    description:
      Dark potassium iron magnesium phyllosilicate K(Fe,Mg)₃AlSi₃O₁₀(OH,F)₂;
      characteristic black to brown flaky mica in granites, granodiorites,
      gneisses, and micaschists. Alters to chlorite on retrogression.
    keywords:
      de: [Biotit, Magnesiaglimmer, Schwarzglimmer]
      fr: [biotite, mica noir, mica ferromagnésien]
      it: [biotite, mica nera]

  calcite:
    description:
      Trigonal calcium carbonate (CaCO₃); the most common carbonate mineral,
      forming white to colourless rhombohedral crystals. Rock-forming in
      limestones, marbles, and calcareous veins; effervesces vigorously with
      dilute HCl.
    keywords:
      de: [Calcit, Kalkspat, Kalzit, Calcit-Kristalle]
      fr: [calcite, spath calcaire, calcite cristallisée]
      it: [calcite, spato calcareo, cristalli di calcite]

  cassiterite:
    description:
      Tin oxide (SnO₂); brown to black adamantine tetragonal crystals; primary
      ore mineral of tin, occurring in granite-related hydrothermal veins,
      pegmatites, and placer deposits.
    keywords:
      de: [Cassiterit, Zinnstein, Kassiterit]
      fr: [cassitérite, étain oxydé]
      it: [cassiterite, cassiterite]

  celestine:
    description:
      Strontium sulphate (SrSO₄); pale blue to colourless orthorhombic crystals;
      occurs in evaporite sequences, hydrothermal veins, and as diagenetic
      mineral in limestones and dolostones. Also spelled celestite.
    keywords:
      de: [Celestin, Zölestin, Coelestin]
      fr: [célestine, célestite, strontianite sulfatée]
      it: [celestina, celestite]

  chalcopyrite:
    description:
      Copper iron sulphide (CuFeS₂); brass-yellow metallic tetragonal mineral,
      the most important copper ore. Common in porphyry copper deposits,
      volcanogenic massive sulphide (VMS) deposits, and hydrothermal veins.
    keywords:
      de: [Chalkopyrit, Kupferkies, Chalcopyrit]
      fr: [chalcopyrite, pyrite cuivreuse]
      it: [calcopirite, pirite di rame]

  chlorite:
    description:
      Group of green phyllosilicate minerals (Mg,Fe,Al)₆(Si,Al)₄O₁₀(OH)₈;
      common retrograde product of mafic minerals in greenschist-facies rocks
      and hydrothermally altered mafic igneous rocks. Appears as green flakey
      or earthy aggregates.
    keywords:
      de: [Chlorit, Chloritgruppe, Eisenchlorit]
      fr: [chlorite, chlorites, minéraux chloriteux]
      it: [clorite, cloriti]

  chloritoid:
    description:
      Iron magnesium aluminium phyllosilicate (Fe,Mg)₂Al₄Si₂O₁₀(OH)₄; dark
      green to grey plates occurring in low- to medium-grade metapelitic rocks
      (phyllites, schists). Indicative of low-temperature, high-pressure
      metamorphic conditions.
    keywords:
      de: [Chloritoid, Ottrelith]
      fr: [chloritoïde, chloritoïde ferrifère]
      it: [cloritoide, clorotoide]

  chromite:
    description:
      Iron chromium oxide (FeCr₂O₄) of the spinel group; black opaque cubic
      crystals; characteristic accessory in ultramafic rocks (dunite, peridotite,
      pyroxenite) and primary ore of chromium. Often occurs as disseminated
      grains or massive pods in ophiolites.
    keywords:
      de: [Chromit, Chrommagnetit, Chromerz]
      fr: [chromite, spinelle chromifère]
      it: [cromite, spinello cromifero]

  chrysotile:
    description:
      Fibrous serpentine group mineral Mg₃Si₂O₅(OH)₄; the most common
      asbestiform mineral, forming silky white to greenish fibres in veins
      cutting serpentinised ultramafic rocks. The principal commercial form
      of asbestos (white asbestos).
    keywords:
      de: [Chrysotil, Serpentinasbest, weißer Asbest]
      fr: [chrysotile, amiante blanc, serpentine fibreuse]
      it: [crisotilo, amianto bianco, serpentino fibroso]

  coesite:
    description:
      High-pressure silica polymorph (SiO₂), stable above ~3 GPa; occurs as
      inclusions in garnet and other high-pressure minerals in ultrahigh-pressure
      metamorphic (UHP) rocks such as eclogites and whiteschists. Its presence
      indicates subduction to mantle depths (>100 km).
    keywords:
      de: [Coesit, Hochdruck-Quarz]
      fr: [coésite, silice haute pression]
      it: [coesite, silice ad alta pressione]

  copper:
    description:
      Native copper metal (Cu); red metallic mineral occurring in oxidised zones
      of copper sulphide deposits, vesicles in basalt (Michigan copper district),
      and as rare accessory in ultramafic rocks. Malleability distinguishes it
      from sulphides.
    keywords:
      de: [Kupfer, gediegenes Kupfer, Kupfermetall]
      fr: [cuivre, cuivre natif, cuivre métallique]
      it: [rame, rame nativo, rame metallico]

  cordierite:
    description:
      Magnesium iron aluminium cyclosilicate (Mg,Fe)₂Al₄Si₅O₁₈; blue to
      grey prismatic crystals in high-temperature, low-pressure metamorphic
      rocks (hornfels, granulites) and granites. Shows distinctive blue
      dichroism (iolite variety used as gemstone).
    keywords:
      de: [Cordierit, Kordierit, Iolith, Dichroit]
      fr: [cordiérite, iolite, dichroïte]
      it: [cordierite, iolite, dicroite]

  corundum:
    description:
      Aluminium oxide (Al₂O₃); trigonal, colourless (white) or variously coloured
      (ruby = red, sapphire = blue); found in aluminium-rich metamorphic rocks,
      alkaline igneous rocks, and laterites. Second hardest natural mineral
      (Mohs 9).
    keywords:
      de: [Korund, Rubin, Saphir, Aluminiumoxid]
      fr: [corindon, rubis, saphir]
      it: [corindone, rubino, zaffiro]

  diaspore:
    description:
      Aluminium oxide hydroxide (AlO(OH)); colourless to white or yellowish
      orthorhombic crystals; found in bauxite deposits, corundum-bearing
      metamorphic rocks, and hydrothermally altered aluminium-rich sediments.
    keywords:
      de: [Diaspor, Aluminiumhydroxid]
      fr: [diaspore, monohydroxyde d'aluminium]
      it: [diasporo, idrossido di alluminio]

  diopside:
    description:
      Calcium magnesium pyroxene (CaMgSi₂O₆); white to light green prismatic
      crystals; common in calcium-rich metamorphic rocks (skarns, marbles,
      calc-silicate gneisses) and mafic igneous rocks. The chromian variety
      (chrome-diopside) is bright green.
    keywords:
      de: [Diopsid, Diopsidpyroxen]
      fr: [diopside, pyroxène diopside]
      it: [diopside, pirosseno diopsidico]

  dolomite:
    description:
      Calcium magnesium carbonate CaMg(CO₃)₂; white to grey or brownish
      rhombohedral crystals; rock-forming in dolostones and as secondary
      replacement of calcite in limestones (dolomitisation). Reacts weakly
      with cold dilute HCl (effervesces only when powdered).
    keywords:
      de: [Dolomit, Dolomitminerahl, Bitterspat]
      fr: [dolomite, dolomie minérale, spath perlé]
      it: [dolomite, minerale dolomite, spato perlacea]

  enstatite:
    description:
      Magnesium pyroxene (MgSiO₃) end-member of the orthopyroxene series;
      grey to greenish prismatic crystals in ultramafic and mafic igneous rocks
      (peridotites, pyroxenites) and some high-grade metamorphic rocks.
    keywords:
      de: [Enstatit, Bronzit, Hypersthen]
      fr: [enstatite, bronzite, hypersthène]
      it: [enstatite, bronzite, iperstene]

  epidote:
    description:
      Calcium aluminium iron sorosilicate Ca₂(Al,Fe)₃Si₃O₁₂(OH); yellow-green
      to dark green prismatic crystals; very common in low- to medium-grade
      metamorphic rocks (greenschist facies) and in hydrothermally altered
      igneous rocks.
    keywords:
      de: [Epidot, Epidotgruppe, Pistazit]
      fr: [épidote, épidote verte, pistazite]
      it: [epidoto, epidote, pistacite]

  feldspar:
    description:
      Framework silicate mineral group comprising alkali feldspars (orthoclase,
      sanidine, albite) and plagioclase series; the most abundant mineral group
      in the Earth's crust. Use this general term when the specific feldspar
      species cannot be determined.
    keywords:
      de: [Feldspat, Feldspäte, Feldspath]
      fr: [feldspath, feldspaths]
      it: [feldspato, feldspati]

  fluorite:
    description:
      Calcium fluoride (CaF₂); cubic, occurring in a wide range of colours
      (purple, green, yellow, colourless); common gangue mineral in hydrothermal
      veins, and accessory in granites and pegmatites. Cleaves perfectly in
      four octahedral directions.
    keywords:
      de: [Fluorit, Flussspat, Flußspat]
      fr: [fluorine, spath fluor, fluorite]
      it: [fluorite, fluorina, spato fluoro]

  forsterite:
    description:
      Magnesium end-member of the olivine series (Mg₂SiO₄); colourless to
      pale yellow; found in ultramafic rocks (dunites), magnesium-rich skarns,
      and high-temperature metamorphic rocks. More resistant to serpentinisation
      than fayalite.
    keywords:
      de: [Forsterit, Magnesiumolivin]
      fr: [forstérite, olivine magnésienne]
      it: [forsterite, olivina magnesiaca]

  fuchsite:
    description:
      Chromium-bearing muscovite (K(Al,Cr)₂AlSi₃O₁₀(OH,F)₂); brilliant emerald-
      green mica occurring as accessory in chromite-bearing ultramafic rocks,
      some greenschist-facies metapelites, and quartz-chromite veins.
    keywords:
      de: [Fuchsit, Chromglimmer, Chrommuskovit]
      fr: [fuchsite, muscovite chromifère]
      it: [fuchsite, muscovite cromifera]

  galena:
    description:
      Lead sulphide (PbS); cubic, heavy (SG ~7.6), bright silver-grey metallic
      mineral with perfect cubic cleavage; primary ore of lead and silver.
      Common in hydrothermal polymetallic veins and Mississippi Valley-type
      (MVT) deposits.
    keywords:
      de: [Galenit, Bleiglanz, Bleiglanz-Galenit]
      fr: [galène, sulfure de plomb]
      it: [galena, solfuro di piombo]

  garnet:
    description:
      Nesosilicate mineral group including almandine, pyrope, grossular,
      spessartite, andradite, and uvarovite; typically occur as characteristic
      dodecahedral or trapezohedral crystals in metamorphic rocks. Use this
      general term when the specific garnet end-member cannot be determined.
    keywords:
      de: [Granat, Granate, Granatgruppe]
      fr: [grenat, grenats, groupe des grenats]
      it: [granato, granati, gruppo dei granati]

  gibbsite:
    description:
      Aluminium hydroxide Al(OH)₃; white to grey massive or earthy mineral
      forming by intense weathering and lateritisation of aluminium-rich rocks.
      A principal component of bauxite deposits.
    keywords:
      de: [Gibbsit, Hydrargillit, Aluminiumhydroxid]
      fr: [gibbsite, hydrargillite, hydroxyde d'aluminium]
      it: [gibbsite, idrargilite, idrossido di alluminio]

  glauconite:
    description:
      Green potassium iron phyllosilicate of the mica group; forms as small
      rounded grains (glauconite pellets) in shallow-marine sediments under
      reducing diagenetic conditions. Used for K–Ar radiometric dating of
      sedimentary sequences.
    keywords:
      de: [Glaukonit, Meeresgrün, Glauconitkörnchen]
      fr: [glauconite, glauconie, grains de glauconie]
      it: [glauconite, granuli di glauconite]

  glaucophane:
    description:
      Sodium aluminium magnesium amphibole Na₂(Mg,Fe)₃Al₂Si₈O₂₂(OH)₂; lavender
      to blue colour, characteristic of blueschist-facies high-pressure low-
      temperature metamorphic rocks. Its presence indicates subduction-related
      metamorphism.
    keywords:
      de: [Glaukophan, Blauschiefer-Amphibol]
      fr: [glaucophane, amphibole sodique bleue]
      it: [glaucofane, anfibolo sodico blu]

  goethite:
    description:
      Iron oxyhydroxide FeO(OH); yellow to dark brown earthy or fibrous mineral;
      the main component of limonite and rusty weathering products of iron-
      bearing minerals. Formed by oxidative weathering of pyrite, siderite,
      and other iron minerals.
    keywords:
      de: [Goethit, Nadeleisenerz, Brauneisenstein]
      fr: [goethite, limonite]
      it: [goethite, limonite]

  gold:
    description:
      Native gold metal (Au); characteristic yellow metallic mineral occurring
      in hydrothermal quartz veins, epithermal deposits, placer deposits, and
      as trace accessory in sulphide ores. Very high density (SG ~19.3) and
      malleability distinguish it from pyrite.
    keywords:
      de: [Gold, gediegenes Gold, Freigold]
      fr: [or, or natif]
      it: [oro, oro nativo]

  graphite:
    description:
      Hexagonal polymorph of carbon; black to dark grey, greasy, soft (Mohs 1–2)
      mineral with metallic lustre; occurs in high-grade metamorphic rocks
      (marbles, gneisses), veins, and as accessory in some igneous rocks.
    keywords:
      de: [Graphit, Reißblei, Schwarzblei]
      fr: [graphite, mine de plomb, plombagine]
      it: [grafite, grafite carboniosa]

  grossular:
    description:
      Calcium aluminium garnet Ca₃Al₂Si₃O₁₂; colourless, green (tsavorite),
      or orange (hessonite); occurs in calcium-rich metamorphic rocks (skarns,
      marbles, calc-silicate gneisses) and rodingites.
    keywords:
      de: [Grossular, Grossulargranate, Hessonit]
      fr: [grossulaire, grenat grossulaire, hessonite]
      it: [grossularia, granato grossulare, essonite]

  gypsum:
    description:
      Hydrated calcium sulphate (CaSO₄·2H₂O); white to colourless soft (Mohs 2)
      monoclinic mineral; primary evaporite mineral in marine and lacustrine
      deposits, also formed by hydration of anhydrite. Varieties include
      alabaster (massive) and selenite (clear crystals).
    keywords:
      de: [Gips, Gipsstein, Alabaster, Selenith, Marienglas]
      fr: [gypse, plâtre naturel, albâtre, sélénite]
      it: [gesso, alabastro, selenite, pietra di gesso]

  halite:
    description:
      Sodium chloride (NaCl); cubic, colourless to white (impurities give blue,
      pink, or red colours); primary evaporite mineral forming rock salt beds
      in marine evaporite sequences. Soluble, characteristically salty taste.
    keywords:
      de: [Halit, Steinsalz, Kochsalz]
      fr: [halite, sel gemme, sel de roche]
      it: [halite, salgemma, cloruro di sodio]

  hematite:
    description:
      Iron(III) oxide (Fe₂O₃); red (earthy) to silver-grey (specular) trigonal
      mineral; found in banded iron formations (BIFs), hydrothermal veins,
      oxidised zones of iron deposits, and as a red pigment in sedimentary
      rocks (red beds).
    keywords:
      de: [Hämatit, Roteisenstein, Eisenglanz, Blutstein]
      fr: [hématite, fer oligiste, spéculaire, hématite rouge]
      it: [ematite, ematite rossa, ferro oligisto]

  hornblende:
    description:
      Common calcium sodium iron magnesium aluminous amphibole; black to dark
      green prismatic crystals with typical 56°/124° cleavage angle. The most
      widespread amphibole in intermediate igneous rocks (diorite, granodiorite)
      and amphibolites.
    keywords:
      de: [Hornblende, gemeines Hornblende, Hornblendeamphibol]
      fr: [hornblende, hornblende commune]
      it: [orneblenda, hornblende comune]

  illite:
    description:
      Potassium aluminium phyllosilicate clay mineral K₀.₆(H₃O)₀.₄Al₂(Si,Al)₄O₁₀(OH)₂;
      common constituent of shales, mudstones, and weathering profiles.
      Intermediate in crystallinity between smectite and muscovite; important
      for illite crystallinity (Kübler index) and K–Ar dating.
    keywords:
      de: [Illit, Illit-Tonmineral, Serizit-Illit]
      fr: [illite, minéral argileux illitique]
      it: [illite, minerale argilloso illite]

  ilmenite:
    description:
      Iron titanium oxide (FeTiO₃); black to dark grey hexagonal mineral;
      primary ore of titanium, occurring as accessory in igneous rocks (gabbros,
      anorthosites), metamorphic rocks, and concentrated in heavy mineral sands.
    keywords:
      de: [Ilmenit, Titaneisenerz, Titaneisen]
      fr: [ilménite, titanate de fer]
      it: [ilmenite, titanato di ferro]

  jadeite:
    description:
      Sodium aluminium pyroxene (NaAlSi₂O₆); white to green prismatic crystals;
      characteristic of high-pressure blueschist-facies and eclogite-facies
      metamorphic rocks. One of the two main minerals called jade (with nephrite).
    keywords:
      de: [Jadeit, Jadeite, Jadeit-Pyroxen]
      fr: [jadéite, jadéite pyroxène, jade jadéite]
      it: [giadeite, giadeite piróssenica, giada]

  kaolinite:
    description:
      Aluminium phyllosilicate clay mineral Al₂Si₂O₅(OH)₄; white earthy to
      chalky material formed by weathering and hydrothermal alteration of
      feldspars and other aluminosilicates. Main component of kaolin clay;
      important indicator of tropical weathering and hydrothermal alteration.
    keywords:
      de: [Kaolinit, Kaolin, Porzellanerde, Kaolinton]
      fr: [kaolinite, kaolin, argile kaolinique]
      it: [caolinite, caolino, argilla caolinica]

  K-feldspar:
    description:
      Potassium feldspar group (KAlSi₃O₈) including orthoclase, microcline,
      and sanidine; typically pink to white or grey; ubiquitous in granites,
      syenites, pegmatites, and some metamorphic rocks. Use this general term
      when the specific K-feldspar polymorph cannot be determined.
    keywords:
      de: [Kalifeldspat, Kaliglimmer, Kalifeldspat, K-Feldspat]
      fr: [feldspath potassique, feldspath K, orthose potassique]
      it: [feldspato potassico, feldspato K]

  kyanite:
    description:
      Aluminium silicate polymorph (Al₂SiO₅) stable at high pressure; blue
      to grey bladed crystals with characteristic variable hardness (4–5 along
      the crystal, 6–7 across). Occurs in high-pressure metamorphic rocks
      (eclogites, blueschists, kyanite gneisses).
    keywords:
      de: [Kyanit, Disthen, Cyanit]
      fr: [kyanite, disthène, cyanite]
      it: [cianite, distene, cianite bluastra]

  leucite:
    description:
      Potassium aluminosilicate (KAlSi₂O₆) with a pseudo-cubic form; white
      to grey trapezohedral crystals in silica-undersaturated potassium-rich
      volcanic rocks (leucitites, phonolites). Unable to coexist with free
      quartz.
    keywords:
      de: [Leucit, Weißit, Leucitkristall]
      fr: [leucite, leucite kalisilicatée]
      it: [leucite, leucite potassica]

  lignite:
    description:
      Low-rank coal (brown coal) with 25–35% carbon; brownish-black, earthy
      to woody appearance. As an accessory component in sedimentary rocks,
      occurs as dark fragments or laminae indicating terrestrial organic input.
    keywords:
      de: [Lignit, Braunkohle, Weichbraunkohle]
      fr: [lignite, charbon brun, houille brune]
      it: [lignite, carbone bruno, carbonite]

  limonite:
    description:
      Field term for hydrated iron oxide mineral mixture (primarily goethite
      and ferrihydrite); yellow to brown earthy masses; the common product of
      iron mineral weathering, forming gossan caps over sulphide ore deposits
      and as staining in sedimentary rocks.
    keywords:
      de: [Limonit, Brauneisenerz, Brauneisenstein, Eisenhydroxid]
      fr: [limonite, oxyde de fer hydraté, rouille naturelle]
      it: [limonite, ossido di ferro idrato, ruggine naturale]

  magnesite:
    description:
      Magnesium carbonate (MgCO₃); white to yellowish rhombohedral crystals;
      found in metamorphic and hydrothermal alteration products of ultramafic
      rocks, evaporite-related sediments, and carbonatites. Reacts slowly with
      cold HCl.
    keywords:
      de: [Magnesit, Bitterspat, Magnesiumkarbonat]
      fr: [magnésite, carbonate de magnésium, giobertite]
      it: [magnesite, carbonato di magnesio, giobertite]

  magnetite:
    description:
      Iron oxide (Fe₃O₄) of the spinel group; black, strongly magnetic, cubic;
      common accessory in mafic igneous rocks, metamorphic rocks, and banded
      iron formations. Key indicator mineral in palaeomagnetic studies.
    keywords:
      de: [Magnetit, Magneteisenerz, Magneteisen]
      fr: [magnétite, oxyde de fer magnétique]
      it: [magnetite, ossido di ferro magnetico]

  mica:
    description:
      Group of phyllosilicate minerals with perfect basal cleavage forming
      flexible elastic sheets; includes muscovite, biotite, phlogopite, and
      lepidolite. Use this general term when the specific mica species cannot
      be determined.
    keywords:
      de: [Glimmer, Glimmergruppe, Glimmermineral]
      fr: [mica, micas, minéral micacé]
      it: [mica, miche, minerale micaceo]

  microcline:
    description:
      Triclinic potassium feldspar (KAlSi₃O₈); typically grey, white, or
      green (amazonite variety); common in granites, pegmatites, and some
      gneisses. Distinguished from orthoclase by cross-hatched (gridiron)
      twinning under the microscope.
    keywords:
      de: [Mikroklin, Mikroklinit, Amazonit]
      fr: [microcline, amazonite, feldspath microcline]
      it: [microclino, amazzonite, feldspato microclinico]

  monazite:
    description:
      Rare earth element phosphate (REE)PO₄ with cerium, lanthanum, and
      neodymium; yellow to brown monoclinic mineral; accessory in granites,
      pegmatites, and metamorphic rocks. Highly resistant to weathering and
      concentrates in heavy mineral sands; used for U–Th–Pb geochronology.
    keywords:
      de: [Monazit, Cerphosphat, Monazitsand]
      fr: [monazite, phosphate de terres rares]
      it: [monazite, fosfato di terre rare]

  montmorillonite:
    description:
      Expanding-lattice smectite clay mineral (Na,Ca)₀.₃(Al,Mg)₂Si₄O₁₀(OH)₂·nH₂O;
      white to grey, highly swelling in water. Main constituent of bentonite,
      formed by weathering of volcanic ash in marine or lacustrine environments.
    keywords:
      de: [Montmorillonit, Smektit, quellfähiger Ton]
      fr: [montmorillonite, smectite, argile gonflante]
      it: [montmorillonite, smectite, argilla rigonfiante]

  muscovite:
    description:
      Potassium aluminium phyllosilicate KAl₂(AlSi₃)O₁₀(OH,F)₂; silvery to
      pale brown flexible elastic sheets; ubiquitous mica in granites, pegmatites,
      schists, and phyllites. The most common white mica.
    keywords:
      de: [Muskovit, Hellglimmer, Weißglimmer, Silberglimmer]
      fr: [muscovite, mica blanc, mica argenté]
      it: [muscovite, mica bianca, mica argentata]

  nepheline:
    description:
      Silica-undersaturated sodium potassium aluminosilicate (Na,K)AlSiO₄;
      grey to white hexagonal crystals in alkaline (silica-deficient) igneous
      rocks such as nepheline syenites, phonolites, and nephelinites. Cannot
      coexist with free quartz.
    keywords:
      de: [Nephelin, Eläolith, Nephelinit]
      fr: [néphéline, éléolite, feldspathoïde]
      it: [nefelina, eleolite, feldspatoide nefelinico]

  oligoclase:
    description:
      Plagioclase feldspar (An₁₀–An₃₀) intermediate between albite and
      andesine; white to grey, common in granites, granodiorites, and
      metamorphic rocks. The variety with golden-bronze iridescence is
      sunstone (aventurine feldspar).
    keywords:
      de: [Oligoklas, Oligoklasplagioklas]
      fr: [oligoclase, plagioclase oligoclase]
      it: [oligoclasio, plagioclasio oligoclasico]

  olivine:
    description:
      Magnesium iron nesosilicate (Mg,Fe)₂SiO₄ forming an isomorphous series
      between forsterite and fayalite; olive-green to yellow-green crystals;
      characteristic rock-forming mineral of ultramafic (peridotite, dunite)
      and mafic igneous rocks. Readily alters to serpentine.
    keywords:
      de: [Olivin, Olivingruppe, Forsterit-Fayalit]
      fr: [olivine, péridot, chrysolithe]
      it: [olivina, peridoto, crisolithe]

  omphacite:
    description:
      Sodium calcium aluminium iron magnesium pyroxene (Ca,Na)(Mg,Fe,Al)Si₂O₆;
      green, the characteristic pyroxene of eclogites; forms under high-pressure
      metamorphic conditions in subducted oceanic or continental crust.
    keywords:
      de: [Omphazit, Omphacitpyroxen, Eklogitpyroxen]
      fr: [omphacite, pyroxène omphacitique, pyroxène des éclogites]
      it: [omfacite, pirosseno omfacitico, pirosseno delle eclogiti]

  orthoclase:
    description:
      Monoclinic potassium feldspar (KAlSi₃O₈); pink, white, or grey; common
      in granites, syenites, and pegmatites. The most common K-feldspar variety
      in medium-grade metamorphic rocks; shows Carlsbad twinning.
    keywords:
      de: [Orthoklas, Orthoklasfeldspat, Orthoklasit]
      fr: [orthose, orthoclase, feldspath orthoclase]
      it: [ortoclasio, ortose, feldspato potassico monoclino]

  phengite:
    description:
      Silicon-rich high-pressure white mica K(Al,Mg,Fe)₂(Si,Al)₄O₁₀(OH,F)₂
      with Si > 3 per formula unit; colourless to pale green; indicative of
      high-pressure metamorphic conditions, common in blueschists, eclogites,
      and subduction-related metamorphic rocks.
    keywords:
      de: [Phengit, Hochdruckglimmer, Si-reicher Muskovit]
      fr: [phengite, muscovite phengitique, mica de haute pression]
      it: [fengite, muscovite fengite, mica ad alta pressione]

  phlogopite:
    description:
      Potassium magnesium phyllosilicate KMg₃(AlSi₃)O₁₀(OH,F)₂; the magnesium-
      rich end-member of the biotite series; brown to amber coloured elastic
      sheets; found in ultramafic rocks (kimberlites, peridotites), magnesian
      marbles, and phlogopite schists.
    keywords:
      de: [Phlogopit, Magnesiumglimmer, Bronzeglimmer]
      fr: [phlogopite, mica magnésien, mica bronze]
      it: [flogopite, mica magnesiaca, mica bronzea]

  plagioclase:
    description:
      Continuous feldspar series from albite (NaAlSi₃O₈) to anorthite
      (CaAl₂Si₂O₈); white to grey, typically showing polysynthetic twinning
      (albite law); the most important rock-forming mineral group in igneous
      and metamorphic rocks. Use this general term when the specific member
      cannot be determined.
    keywords:
      de: [Plagioklas, Plagioklasreihe, Natriumfeldspat, Calziumfeldspat]
      fr: [plagioclase, série des plagioclases]
      it: [plagioclasio, serie dei plagioclasi]

  prehnite:
    description:
      Calcium aluminium phyllosilicate Ca₂Al(Si₃Al)O₁₀(OH)₂; pale green to
      yellow-green, forming stalactitic or reniform aggregates; characteristic
      low-temperature hydrothermal or prehnite-pumpellyite facies metamorphic
      mineral in basalts, gabbros, and greenschist-facies rocks.
    keywords:
      de: [Prehnit, Prehnit-Mineral]
      fr: [prehnite, prehnite verte]
      it: [prehnite, prehnite verde]

  pyrite:
    description:
      Iron disulphide (FeS₂); cubic, brass-yellow metallic crystals (cubes,
      pyritohedra); the most abundant sulphide mineral, occurring in virtually
      all geological environments. Weathers to goethite/limonite; pyrite
      oxidation generates acid rock drainage.
    keywords:
      de: [Pyrit, Eisenkies, Schwefelkies, Katzengold]
      fr: [pyrite, pyrite de fer, sulfure de fer cubique]
      it: [pirite, pirite di ferro, solfuro di ferro]

  pyrope:
    description:
      Magnesium aluminium garnet Mg₃Al₂Si₃O₁₂; deep red to purple dodecahedral
      crystals; characteristic accessory in kimberlites, peridotites, and
      high-pressure granulites. Used as an indicator mineral in diamond
      exploration.
    keywords:
      de: [Pyrop, Pyropgranat, böhmischer Granat]
      fr: [pyrope, grenat pyrope, grenat magnésien]
      it: [piropo, granato piropo]

  pyrophyllite:
    description:
      Aluminium phyllosilicate Al₂Si₄O₁₀(OH)₂; white to pale green, greasy
      feel, very soft (Mohs 1–2); structurally analogous to talc but aluminium-
      bearing. Formed by hydrothermal alteration of aluminous sediments and in
      low-grade metamorphic rocks.
    keywords:
      de: [Pyrophyllit, Rohstein, Federstein]
      fr: [pyrophyllite, pyrophyllite alumineuse]
      it: [pirofillite, pirofillite alluminosa]

  pyroxene:
    description:
      Group of single-chain inosilicate minerals including augite, diopside,
      enstatite, jadeite, and omphacite; typically prismatic with two cleavages
      at ~87°/93°. Rock-forming minerals in mafic and ultramafic igneous rocks
      and high-grade metamorphic rocks. Use this general term when the specific
      pyroxene cannot be identified.
    keywords:
      de: [Pyroxen, Pyroxengruppe, Pyroxene]
      fr: [pyroxène, pyroxènes, groupe des pyroxènes]
      it: [pirosseno, pirosseni, gruppo dei pirosseni]

  quartz:
    description:
      Silicon dioxide (SiO₂); hexagonal, colourless to white (and many colour
      varieties), Mohs hardness 7; the second most abundant mineral in the
      continental crust. Ubiquitous in igneous, metamorphic, and sedimentary
      rocks; resistant to weathering.
    keywords:
      de: [Quarz, Bergkristall, Milchquarz, Rauchquarz, Rosenquarz]
      fr: [quartz, cristal de roche, quartz laiteux, quartz fumé]
      it: [quarzo, cristallo di rocca, quarzo latteo, quarzo affumicato]

  rutile:
    description:
      Titanium dioxide (TiO₂); reddish-brown to black tetragonal prisms;
      common high-temperature and high-pressure accessory mineral in igneous,
      metamorphic, and sedimentary rocks. Used for U–Pb geochronology and as
      indicator of eclogite-facies metamorphism.
    keywords:
      de: [Rutil, Titaniumdioxid, Rutil-Nadeln]
      fr: [rutile, dioxyde de titane, rutile rouge]
      it: [rutilo, biossido di titanio, rutilo rosso]

  sapphirine:
    description:
      Magnesium aluminium sorosilicate (Mg,Al)₈(Al,Si)₆O₂₀; blue to green or
      pale blue; an indicator of ultra-high temperature (UHT) granulite-facies
      metamorphism. Rare, occurring in aluminous granulites and anorthosites.
    keywords:
      de: [Sapphirin, Saphirin, Hochtemperaturindikator]
      fr: [sapphirine, sapphirine alumineuse]
      it: [saffirina, minerale ultrametamorfico]

  scapolite:
    description:
      Calcium sodium aluminium silicate mineral group (marialite–meionite series);
      grey to white prismatic crystals; characteristic of calcium-rich metamorphic
      rocks (skarns, calc-silicate gneisses) and some hydrothermally altered
      igneous rocks.
    keywords:
      de: [Skapolith, Wernerit, Meionit, Marialith]
      fr: [scapolite, wernerite, méionite, marialite]
      it: [scapolite, wernerite, meionite, marialite]

  sericite:
    description:
      Fine-grained white mica (predominantly muscovite or phengite); silky
      sheen on foliation planes; formed by hydrothermal alteration of feldspars
      (sericitisation) and in low-grade metamorphic rocks. Common alteration
      product in porphyry copper and epithermal gold systems.
    keywords:
      de: [Serizit, Sericite, feinkörniger Hellglimmer]
      fr: [séricite, séricite fine, muscovite séricitique]
      it: [sericite, mica bianca fine, muscovite sericitica]

  serpentine:
    description:
      Group of magnesium phyllosilicate minerals Mg₃Si₂O₅(OH)₄ including
      lizardite, antigorite, and chrysotile; green to grey, waxy lustre;
      formed by hydrothermal alteration (serpentinisation) of olivine and
      pyroxene in ultramafic rocks. Use this general term when the specific
      serpentine polymorph cannot be determined.
    keywords:
      de: [Serpentin, Serpentingruppe, Serpentinmineral]
      fr: [serpentine, minéral serpentineux, groupe des serpentines]
      it: [serpentino, serpentinite minerale, gruppo delle serpentine]

  siderite:
    description:
      Iron(II) carbonate (FeCO₃); grey to yellowish-brown rhombohedral crystals;
      occurs in hydrothermal veins, sedimentary iron formations, and as
      diagenetic mineral in reducing environments (swamps, bogs, marine muds).
      An important ore of iron in some historical mining districts.
    keywords:
      de: [Siderit, Eisenspat, Spateisenstein]
      fr: [sidérite, carbonate de fer, spath sidéritique]
      it: [siderite, carbonato di ferro, spatoferrite]

  sillimanite:
    description:
      Aluminium silicate polymorph (Al₂SiO₅) stable at high temperature;
      white to grey fibrous or prismatic crystals (fibrolite = fibrous variety);
      diagnostic mineral of high-temperature metamorphic zones (upper amphibolite
      to granulite facies) in metapelitic rocks.
    keywords:
      de: [Sillimanit, Fibrolith, Sillimenit]
      fr: [sillimanite, fibrolite, sillimanite fibreuse]
      it: [sillimanite, fibrolite, sillimanite fibrosa]

  silver:
    description:
      Native silver metal (Ag); white to grey metallic mineral; occurs in
      hydrothermal silver veins, as secondary mineral in oxidised zones of
      sulphide deposits, and as accessory in polymetallic ores. Identified by
      its white tarnishing surface and high density.
    keywords:
      de: [Silber, gediegenes Silber, Silbermetall]
      fr: [argent, argent natif, argent métallique]
      it: [argento, argento nativo, argento metallico]

  smectite:
    description:
      Group of swelling 2:1 clay minerals including montmorillonite, nontronite,
      saponite, and beidellite; fine-grained, high plasticity, and high water
      absorption. Formed from volcanic ash alteration or intense weathering.
      Use this general term when the specific smectite species is not identified.
    keywords:
      de: [Smektit, quellfähige Tonminerale, Smektitgruppe]
      fr: [smectite, argile gonflante, groupe des smectites]
      it: [smectite, argille rigonfianti, gruppo delle smectiti]

  spessartite:
    description:
      Manganese aluminium garnet Mn₃Al₂Si₃O₁₂; orange to red dodecahedral
      crystals; occurs in granite pegmatites, manganese-rich metamorphic rocks,
      and skarns. Often forms solid solutions with almandine.
    keywords:
      de: [Spessartin, Spessartit-Granat, Mangangranat]
      fr: [spessartite, grenat spessartite, grenat manganèsifère]
      it: [spessartina, granato spessartite, granato manganesifero]

  sphalerite:
    description:
      Zinc sulphide (ZnS); yellow to brown to black cubic crystals with resinous
      lustre; the primary ore mineral of zinc, occurring in hydrothermal
      polymetallic veins, skarn deposits, and Mississippi Valley-type (MVT)
      carbonate-hosted deposits.
    keywords:
      de: [Sphalerit, Zinkblende, Blende]
      fr: [sphalérite, blende, blende zincifère]
      it: [sfalerite, blenda, blenda zincifera]

  spinel:
    description:
      Magnesium aluminium oxide (MgAl₂O₄) of the spinel group; red, blue, or
      black octahedral crystals; accessory in mafic and metamorphic rocks, and
      as an indicator of high-pressure and high-temperature conditions. Chrome
      spinel is common in ultramafic rocks.
    keywords:
      de: [Spinell, Spinellgruppe, Chromspinell]
      fr: [spinelle, groupe des spinelles, spinelle chromifère]
      it: [spinello, gruppo degli spinelli, spinello cromifero]

  staurolite:
    description:
      Iron magnesium aluminium nesosilicate Fe₂Al₉Si₄O₂₃(OH); dark brown to
      black prismatic crystals, often forming characteristic cross-shaped
      twinned crystals (fairy crosses). Diagnostic of medium-grade amphibolite-
      facies metapelitic rocks.
    keywords:
      de: [Staurolith, Kreuzstein, Staurolit]
      fr: [staurolite, staurotide, pierre de croix]
      it: [staurolite, staurolito, pietra a croce]

  stilpnomelane:
    description:
      Iron potassium phyllosilicate K(Fe,Mg,Al)₈(Si,Al)₁₂O₂₇(OH)₁₄; dark
      brown to black, shiny lamellae resembling biotite; indicative of low-
      grade greenschist-facies or subgreenschist conditions in iron-rich
      metasedimentary rocks and banded iron formations.
    keywords:
      de: [Stilpnomelan, Stilpnomelan-Schiefer]
      fr: [stilpnomélane, stilpnomélane ferrifère]
      it: [stilpnomelano, stilpnomelano ferrifero]

  sulfur:
    description:
      Native sulfur element (S); bright yellow orthorhombic crystals;
      occurs around volcanic fumaroles and hot springs, in salt dome cap rocks
      (evaporite-associated), and as a product of H₂S oxidation. Distinctive
      yellow colour and low melting point (113 °C).
    keywords:
      de: [Sulfur, Schwefel, gediegener Schwefel]
      fr: [soufre, soufre natif, soufre minéral]
      it: [zolfo, zolfo nativo, zolfo minerale]

  talc:
    description:
      Magnesium phyllosilicate Mg₃Si₄O₁₀(OH)₂; the softest mineral (Mohs 1),
      white to pale green, greasy feel; formed by hydrothermal or metamorphic
      alteration of magnesium-rich rocks (serpentinites, dolomites). Main
      component of soapstone (steatite).
    keywords:
      de: [Talk, Talkstein, Steatit, Speckstein]
      fr: [talc, stéatite, talc magnésien]
      it: [talco, steatite, pietra di sapone]

  titanite:
    description:
      Calcium titanium nesosilicate (CaTiSiO₅), also called sphene; brown to
      yellow wedge-shaped crystals; common accessory in granites, granodiorites,
      calc-alkaline volcanics, and some metamorphic rocks. Used for U–Pb
      geochronology.
    keywords:
      de: [Titanit, Sphäne, Sphen, Titanit-Sphene]
      fr: [titanite, sphène, sphène calcaire]
      it: [titanite, sfeno, sfeno calcareo]

  tourmaline:
    description:
      Boron cyclosilicate mineral group with complex chemistry including
      schorl (black, iron-rich), dravite (brown, magnesium-rich), and elbaite
      (multicoloured, lithium-bearing); prismatic crystals with trigonal
      cross-section and striated prism faces. Common accessory in granites,
      pegmatites, and metamorphic rocks.
    keywords:
      de: [Turmalin, Schörl, Dravit, Elbaite, Turmalingruppe]
      fr: [tourmaline, schorl, dravite, elbaïte]
      it: [tormalina, schorl, dravite, elbaite]

  tremolite:
    description:
      Calcium magnesium amphibole Ca₂Mg₅Si₈O₂₂(OH)₂; white to grey bladed
      or fibrous crystals; characteristic of metamorphosed dolomitic limestones,
      serpentinites, and talc schists. The fibrous variety is an asbestiform
      mineral (tremolite asbestos).
    keywords:
      de: [Tremolit, Tremolite, Tremolit-Amphibol]
      fr: [trémolite, amphibole trémolite]
      it: [tremolite, anfibolo tremolite]

  vermiculite:
    description:
      Magnesium iron aluminium phyllosilicate clay mineral; gold-brown flaky
      mineral that exfoliates greatly when heated (used as insulation and
      horticultural medium). Formed by hydrothermal or weathering alteration
      of biotite or phlogopite in mafic and ultramafic rocks.
    keywords:
      de: [Vermikulit, Glimmerton, Blähglimmer]
      fr: [vermiculite, mica exfolié]
      it: [vermiculite, mica espansa]

  wollastonite:
    description:
      Calcium inosilicate (CaSiO₃); white to grey prismatic crystals; formed
      by reaction of calcite with silica at high temperatures in skarns and
      thermally metamorphosed limestones (calc-silicate rocks). An indicator
      of high-temperature contact metamorphism.
    keywords:
      de: [Wollastonit, Kalziumsilikat]
      fr: [wollastonite, silicate de calcium]
      it: [wollastonite, silicato di calcio]

  zeolite:
    description:
      Group of hydrated aluminosilicate minerals with an open framework structure
      (clinoptilolite, analcime, natrolite, heulandite, etc.); white, occurring
      in vesicles of basalts, low-grade metamorphic rocks, and diagenetically
      altered tuffs. Use this general term when the specific zeolite species
      cannot be determined.
    keywords:
      de: [Zeolith, Zeolithgruppe, Zeolithe]
      fr: [zéolite, zéolithe, groupe des zéolites]
      it: [zeolite, zeoliti, gruppo delle zeoliti]

  zircon:
    description:
      Zirconium silicate (ZrSiO₄); small tetragonal prismatic crystals, commonly
      colourless to brown; the most important mineral for U–Pb isotopic
      geochronology due to its resistance to alteration and inclusion of uranium.
      Ubiquitous accessory in granites and other silicic igneous rocks.
    keywords:
      de: [Zirkon, Zirkonium-Silikat, Zirkonsand]
      fr: [zircon, zircon accessoire, silicate de zirconium]
      it: [zircone, silicato di zirconio, zircone accessorio]

  zoisite:
    description:
      Calcium aluminium sorosilicate Ca₂Al₃Si₃O₁₂(OH); grey to green (or pink
      = thulite, blue = tanzanite variety); characteristic of medium-grade
      metamorphic rocks and hydrothermal alteration of calcareous rocks.
      Common in blueschist and eclogite assemblages as an epidote-group mineral.
    keywords:
      de: [Zoisit, Thulite, Tansanit, Zoisitgruppe]
      fr: [zoïsite, thulite, tanzanite, groupe de la zoïsite]
      it: [zoisite, thulite, tanzanite, gruppo della zoisite]

  other:
    description:
      Mineral component clearly present but not assignable to any defined
      category in this classification system. Use only when the mineral is
      identifiable but genuinely falls outside all other classes.
    keywords:
      de: [andere, anderes, sonstige, verschiedene Minerale]
      fr: [autre, autres, divers, autres minéraux]
      it: [altro, altri, varie, altri minerali]
