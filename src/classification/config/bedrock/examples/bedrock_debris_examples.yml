baseline: |
  not_specified:
    description:
      No debris type is present or inferable. Use not_specified when the
      material description contains no mention of rounded clasts, angular
      fragments, erratic boulders, construction debris, tufa, or any other
      debris indicator. This is the default class for pure soil or rock
      descriptions that describe only grain size, texture, colour, or
      plasticity. Geröll or galet mentioned only as a lithological qualifier
      (e.g. "Gerölle: Kalke und Sandsteine") rather than as a primary
      material component also stays not_specified. Never assign not_specified
      when a debris signal is present.
    keywords:
      de: [keine Angabe, unbekannt, nicht beschrieben]
      fr: [sans indication]
      it: [senza indicazioni]
      en: [not specified]

  bed_load:
    description:
      Fluvially transported rounded clasts — the primary debris signal is
      well-rounded to subrounded pebbles, cobbles, or boulders transported
      and shaped by river or stream action. The dominant French indicator is
      "galets" (rounded river pebbles); German equivalent is "Geschiebe"
      (bed-load material) or rounded Gerölle explicitly described as river
      or glaciofluvial origin. Descriptions often include "galets et
      cailloux", "galets roulés", "galets hétérométriques", "dm. fréquent",
      "dm. maximum observé", or "Blocs, galets, cailloux et gravillons dans
      une matrice". Use bed_load when rounded to subrounded fluvial elements
      are the defining debris component. Do NOT use bed_load when clasts are
      described as angular, poorly rounded, or when the description is purely
      a USCS soil type without an explicit rounded-clast signal.
    keywords:
      de: [Geschiebe, Gerölle gerundet, Gerölle gut gerundet, galetartige Gerölle]
      fr: [galets, galets roulés, galets et cailloux, galets hétérométriques, galets subarrondis, galets alpins roulés, zone à blocaux galets]
      it: [ciottoli, ghiaia arrotondata]
      en: [bed load, rounded pebbles, river gravel]

  erratic_block:
    description:
      Erratic boulder — a large, isolated rock fragment of clearly exotic
      or transported glacial origin, displaced far from its source. The
      primary German indicator is "Findling" (erratic boulder). Use only
      when the description explicitly identifies an erratic or glacially
      transported block. A normal gravel layer with boulders is not an
      erratic; erratic blocks are anomalous isolated objects with identified
      or implied foreign lithology (granite, quartzite, alpine limestone
      in lowland settings).
    keywords:
      de: [Findling, Granitfindling, Quarzitfindling, Findlinge, Granitblock erratisch]
      fr: [bloc erratique, erratique]
      it: [masso erratico]
      en: [erratic block, erratic boulder]

  fragments_splitters:
    description:
      Angular rock fragments, splinters, or broken pieces — the primary
      debris signal is hard, angular to subangular fragments derived from
      rock breakage, drilling, weathering, or mechanical processes. Includes
      rock-fragment pieces embedded in a soil matrix (Brocken, Bruchstücke,
      Splitter), angular debris from bedrock disintegration (Blockschutt,
      Schutt), construction or masonry rubble of mineral/rock origin
      (Mauerwerk aus Bruchsteinen, Sandsteinquader, Ziegeltrümmer), hard
      cores or cemented nodules (harte Brocken, harte Kerne), rock-type
      fragments that indicate bedrock proximity (Sandsteinbrocken,
      Molassebrocken, Konglomeratbrocken, Nagelfluhresten, Mergelstücke,
      Gipsbrocken), and spring tufa fragments embedded in matrix
      (Quelltuff als Brocken). Use fragments_splitters when angular,
      broken, or hard rock pieces are the defining debris character.
      Do NOT use for rounded river pebbles (those are bed_load) or for
      surface construction fill with bricks and waste (that is rubble).
    keywords:
      de: [Brocken, Bruchstücke, Splitter, Blockschutt, Schutt, Ziegeltrümmer, Mauerwerk aus Bruchsteinen, Sandsteinbrocken, Molassebrocken, Konglomeratbrocken, Nagelfluhresten, harte Brocken, harte Kerne, kantige Bruchstücke, Mergelstücke, Gipsbrocken, Quelltuff als Brocken, Bröckchen]
      fr: [fragments anguleux, débris rocheux anguleux, blocs anguleux, morceaux de roche]
      it: [frammenti angolosi, detriti rocciosi]
      en: [fragments, splinters, angular rock fragments, rock debris]

  rubble:
    description:
      Rubble — heterogeneous construction debris, mixed urban waste, or
      poorly sorted coarse material containing human-made or reworked
      components mixed with natural material. German primary indicators:
      Geröll and Gerölle as the main noun (rounded boulders/cobbles in
      the context of reworked or re-deposited material), Geröllstücke,
      Geröllhorizont. French primary indicators: gravats (construction
      rubble, broken materials), débris métalliques, morceaux de briques,
      fragments rouges, scories (slag), morceaux de verre, maçonnerie
      hétérogène. Also includes natural coarse material clearly described
      as reworked or re-deposited (remblais, remplissage) containing mixed
      natural and anthropogenic fragments. The distinction from
      fragments_splitters: rubble implies a mixed, often anthropogenic
      or reworked origin; fragments_splitters implies fresh angular rock
      breakage from natural bedrock. The distinction from bed_load: rubble
      clasts are poorly rounded, mixed-origin, or anthropogenic; bed_load
      clasts are well-rounded fluvial elements.
    keywords:
      de: [Geröll, Gerölle, Geröllstücke, Geröllhorizont, Geröllen]
      fr: [gravats, débris métalliques, morceaux de briques, fragments rouges, scories, morceaux de verre, maçonnerie hétérogène, galets mal roulés, galets arrondis fond graveleux]
      it: [macerie, detriti misti]
      en: [rubble, construction debris, mixed debris]

  tufa:
    description:
      Spring tufa or calcareous tufa as the PRIMARY material — a porous,
      lightweight, calcareous deposit precipitated by spring or stream
      water. Use tufa only when Quelltuff or tufa is explicitly the
      dominant material of the layer, not merely a minor constituent or
      fragment embedded in a soil matrix. When Quelltuff appears as a
      minor fragment alongside another debris signal (Tuffbrocken, wenig
      Quelltuff in soil matrix), assign BOTH tufa AND fragments_splitters.
    keywords:
      de: [Quelltuff, Kalktuff, Tuffstein Kalk]
      fr: [tuf calcaire, travertin, tuf de source]
      it: [tufo calcareo, travertino]
      en: [tufa, calcareous tufa, spring tufa]
