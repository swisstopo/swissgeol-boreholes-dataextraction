baseline: |
  Not specified:
    description:
      No bedrock lithology is stated or inferable from the text. Use when
      the description carries no lithological information at all — blank
      intervals, purely technical drilling remarks, or notes recording
      only colour, hardness or water inflow. Do not use as a fallback
      when a lithology can be reasonably inferred from facies or local
      wording (e.g. "calcaire oolithique" implies Limestone, "Nagelfluh"
      implies Conglomerate). If the text states that consolidated bedrock
      was reached but names no rock type, use Rock instead.
    keywords:
      de: [keine Angabe, nicht angegeben, unbekannt, nicht beschrieben,
           k.A.]
      en: [not specified, no indication, unknown, not described]
      fr: [sans indication, non spécifié]
      it: [senza indicazioni, non specificato]

  Amphibolite:
    description:
      Metamorphic rock essentially composed of minerals of the amphibole
      group, usually with plagioclase, derived from mafic protoliths at
      medium to high grade. Distinct from Prasinite (lower grade, white
      ocellar albite in a green matrix) and from Eclogite (garnet plus
      omphacite, high pressure and low temperature).
    keywords:
      de: [Amphibolit, Amphibolite]
      en: [amphibolite, amphibolites]
      fr: [amphibolite, amphibolites]
      it: [anfibolite, anfiboliti]

  Andesite:
    description:
      Volcanic rock with max. 20% quartz or max. 10% feldspatoid and more
      than 65% plagioclase in the QAPF diagram; the texture is
      microlithic. Volcanic equivalent of Diorite. Occupies the same QAPF
      field as Basalt, which is distinguished by its melanocratic, mafic
      character.
    keywords:
      de: [Andesit, Andesite]
      en: [andesite, andesites]
      fr: [andésite, andésites]
      it: [andesite, andesiti]

  Aplite:
    description:
      Leucocratic acidic microcrystalline rock emplaced as dikes and/or
      sills, or forming the fine-grained peripheral facies of a plutonic
      intrusion. Also called aplitic rock. Shares this setting with
      Pegmatite (very large automorphic crystals) and Granophyre
      (subvolcanic, porphyric, graphic quartz and alkali feldspar
      intergrowth), so use the grain size and texture to separate them.
    keywords:
      de: [Aplit, Aplite]
      en: [aplite, aplites, aplitic rock]
      fr: [aplite, aplites]
      it: [aplite, apliti]

  Basalt:
    description:
      Melanocratic mafic volcanic rock with max. 20% quartz or max. 10%
      feldspatoid and more than 65% plagioclase in the QAPF diagram; the
      texture is microlithic. Volcanic equivalent of Gabbro, and the
      mafic counterpart of Andesite in the same QAPF field.
    keywords:
      de: [Basalt, Basalte]
      en: [basalt, basalts]
      fr: [basalte, basaltes]
      it: [basalto, basalti]

  Basanite:
    description:
      Strongly undersaturated mafic volcanic rock, close to Tephrite but
      olivine-rich. The reference vocabulary carries no definition for
      this class, so assign it only where the text names basanite
      explicitly rather than inferring it from an undersaturated
      composition.
    keywords:
      de: [Basanit, Basanite]
      en: [basanite, basanites]
      fr: [basanite, basanites]
      it: [basanite, basaniti]

  Bentonite:
    description:
      Very fine-grained clay-rich residual rock consisting mostly of
      absorbent, swelling montmorillonite, formed by the weathering of
      volcanic tuff. Use only where the swelling montmorillonite clay or
      its volcanic parentage is described or the term is used; ordinary
      clay-grade clastic rock is Claystone.
    keywords:
      de: [Bentonit, Bentonite]
      en: [bentonite, bentonites]
      fr: [bentonite, bentonites]
      it: [bentonite, bentoniti]

  Breccia:
    description:
      Coarse-grained clastic rock (mean grainsize above 2 mm) with
      angular components, where the fragmentation process, sedimentary
      or tectonic, is not further specified. Distinct from Conglomerate
      (rounded components), and from Cataclastite and Kakirite, which
      are the classes to use once the text attributes the fragmentation
      to a deformation zone.
    keywords:
      de: [Brekzie, Brekzien, Breccie]
      en: [breccia, breccias]
      fr: [brèche, brèches]
      it: [breccia, brecce]

  Cataclastite:
    description:
      Cohesive rock formed by tectonic fragmentation in a deformation
      zone. Distinct from Kakirite (same process, non-cohesive), from
      Mylonite (ductile deformation) and from Pseudotachyllite (melting
      by frictional heat).
    keywords:
      de: [Kataklasit, Kataklasite]
      en: [cataclastite, cataclastites]
      fr: [cataclastite, cataclastites]
      it: [cataclastite, cataclastiti]

  Claystone:
    description:
      Very fine-grained clastic sedimentary rock, mean grainsize below
      1/256 mm. Also called shale. Distinct from Siltstone (1/256 to
      1/16 mm) and from Marlstone (same fine range but carbonate-rich).
      Use Pelite instead when the text indicates only a fine-grained
      clastic rock without resolving clay from silt.
    keywords:
      de: [Tonstein, Tonsteine]
      en: [claystone, claystones, shale, shales]
      fr: [argilite, argilites, argillite]
      it: [argillite, argilliti]

  Conglomerate:
    description:
      Coarse-grained clastic sedimentary rock (mean grainsize above 2 mm)
      with rounded components; also puddingstone, and Nagelfluh in Swiss
      usage. Distinct from Breccia (angular components) and from Psephite,
      the umbrella class to use when roundness is not reported.
    keywords:
      de: [Konglomerat, Konglomerate, Nagelfluh]
      en: [conglomerate, conglomerates, puddingstone]
      fr: [conglomérat, conglomérats, poudingue]
      it: [conglomerato, conglomerati, puddinga]

  Dacite:
    description:
      Leucocratic acidic volcanic rock with more than 20% quartz and more
      than 65% plagioclase in the QAPF diagram; the texture is microlithic
      to porphyric with a large amount of glass. Volcanic equivalent of
      Granodiorite; Rhyolite is the more alkali-feldspar-rich counterpart
      with less than 65% plagioclase.
    keywords:
      de: [Dazit, Dazite]
      en: [dacite, dacites]
      fr: [dacite, dacites]
      it: [dacite, daciti]

  Diorite:
    description:
      Plutonic rock with max. 20% quartz and more than 65% plagioclase in
      the QAPF diagram. Plutonic equivalent of Andesite. Distinct from
      Gabbro (same QAPF field, mafic and melanocratic) and from Tonalite
      (20-60% quartz, more than 90% plagioclase).
    keywords:
      de: [Diorit, Diorite]
      en: [diorite, diorites]
      fr: [diorite, diorites]
      it: [diorite, dioriti]

  Dolostone:
    description:
      Sedimentary rock essentially composed of the mineral dolomite
      (calcium magnesium carbonate). It forms primarily by biochemical
      processes, secondarily through diagenetic replacement, or
      indirectly by accumulation and cementation of dolomitic clasts.
      Distinct from Limestone (calcite) and from Rauwacke, the porous,
      brecciated to vacuolar cellular dolostone.
    keywords:
      de: [Dolomitstein, Dolomitsteine, Dolomit]
      en: [dolostone, dolostones, dolomite rock]
      fr: [dolomie, dolomies]
      it: [dolomia, dolomie]

  Eclogite:
    description:
      Mafic metamorphic rock typically composed of garnet and omphacite
      (sodium-rich pyroxene), formed under high-pressure and
      low-temperature conditions. The name should not be used
      indiscriminately for every rock metamorphosed under eclogite-facies
      conditions — reserve it for the garnet plus omphacite assemblage.
    keywords:
      de: [Eklogit, Eklogite]
      en: [eclogite, eclogites]
      fr: [éclogite, éclogites]
      it: [eclogite, eclogiti]

  Evaporite:
    description:
      Sedimentary rock formed by chemical precipitation, typically
      gypsum, anhydrite or rock salt. Where such levels have been
      dissolved and brecciated into a porous carbonate rock, the
      resulting lithology is Rauwacke rather than Evaporite.
    keywords:
      de: [Evaporit, Evaporite, Salzgestein, Evaporitgestein]
      en: [evaporite, evaporites, evaporitic rock]
      fr: [évaporite, évaporites, roche évaporitique]
      it: [evaporite, evaporiti, roccia evaporitica]

  Foidite:
    description:
      Strongly undersaturated volcanic rock with no quartz and a
      predominant feldspatoid mineralogy (more than 60% in the QAPF
      diagram). Volcanic counterpart of Foidolite. Distinct from
      Phonolite and Tephrite, which carry more than 10% but less than
      60% feldspatoid.
    keywords:
      de: [Foidit, Foidite]
      en: [foidite, foidites]
      fr: [foïdite, foïdites]
      it: [foidite, foiditi]

  Foidolite:
    description:
      Strongly undersaturated plutonic rock with no quartz and a
      predominant feldspatoid mineralogy (more than 60% in the QAPF
      diagram). Plutonic counterpart of Foidite.
    keywords:
      de: [Foidolit, Foidolite]
      en: [foidolite, foidolites]
      fr: [foïdolite, foïdolites]
      it: [foidolite, foidoliti]

  Gabbro:
    description:
      Mafic plutonic rock with max. 20% quartz and more than 65%
      plagioclase in the QAPF diagram. Plutonic equivalent of Basalt, and
      the mafic counterpart of Diorite in the same QAPF field.
    keywords:
      de: [Gabbro, Gabbros]
      en: [gabbro, gabbros]
      fr: [gabbro, gabbros]
      it: [gabbro, gabbri]

  Gneiss:
    description:
      Layered metamorphic rock whose gneissose cleavage planes lie more
      than 1 cm apart. Part of the foliation series with Schist (0,1-1 cm)
      and Phyllite (finest). Distinct from Granofels and Granulite
      (granoblastic, massive, non-foliated to gneissose) and from
      Migmatite, where partial melting has segregated leucosome from
      melanosome.
    keywords:
      de: [Gneis, Gneise]
      en: [gneiss, gneisses]
      fr: [gneiss]
      it: [gneiss]

  Granite:
    description:
      Leucocratic acidic plutonic rock with 20-60% quartz and less than
      65% plagioclase in the QAPF diagram. Volcanic equivalent is
      Rhyolite. Distinct from Granodiorite (65-90% plagioclase) and
      Tonalite (more than 90% plagioclase).
    keywords:
      de: [Granit, Granite]
      en: [granite, granites]
      fr: [granite, granites, granit]
      it: [granito, graniti]

  Granodiorite:
    description:
      Leucocratic acidic plutonic rock with 20-60% quartz and 65-90%
      plagioclase in the QAPF diagram, between Granite and Tonalite.
      Volcanic equivalent is Dacite.
    keywords:
      de: [Granodiorit, Granodiorite]
      en: [granodiorite, granodiorites]
      fr: [granodiorite, granodiorites]
      it: [granodiorite, granodioriti]

  Granofels:
    description:
      Metamorphic rock with a granoblastic texture and a massive,
      non-foliated aspect; also called fels. Carries no implication of
      metamorphic grade, unlike Granulite (high grade, massive to
      gneissose). Note that German "Fels" in its everyday sense means
      bedrock or cliff — assign this class only where it denotes the
      granoblastic rock type.
    keywords:
      de: [Granofels, Fels]
      en: [granofels, fels]
      fr: [granofels, fels]
      it: [granofels]

  Granophyre:
    description:
      Subvolcanic porphyric rock, generally of granitic composition,
      characterised by graphic intergrowth of quartz and alkali feldspar.
      Also called granophyric rock. Compare Aplite (microcrystalline) and
      Pegmatite (very coarse) in the same dike and intrusion-margin
      setting.
    keywords:
      de: [Granophyr, Granophyre]
      en: [granophyre, granophyres, granophyric rock]
      fr: [granophyre, granophyres]
      it: [granofiro, granofiri]

  Granulite:
    description:
      High-grade metamorphic rock with a granoblastic texture and a
      massive to layered (gneissose) aspect. Distinct from Granofels,
      which has the same granoblastic, non-foliated fabric but implies
      no metamorphic grade.
    keywords:
      de: [Granulit, Granulite]
      en: [granulite, granulites]
      fr: [granulite, granulites]
      it: [granulite, granuliti]

  Hornfels:
    description:
      Rock formed by contact metamorphism, typically hard and
      fine-grained, occurring in the thermal aureole of an intrusion.
      Triggered by "cornéenne", "Hornfels", "cornubianite" and by
      explicit reference to contact-metamorphic rock.
    keywords:
      de: [Hornfels, Gestein der Kontaktmetamorphose]
      en: [hornfels, contact metamorphic rock]
      fr: [cornéenne, cornéennes, roche du métamorphisme de contact]
      it: [cornubianite, hornfels]

  Ignimbrite:
    description:
      Volcano-clastic rock in which elements of pyroclastic origin
      dominate (more than 75%), characteristically a poorly sorted
      mixture of volcanic ash, pumice lapilli and scattered lithic
      fragments. Distinct from Tuffite, where the volcanic proportion is
      25-75%.
    keywords:
      de: [Ignimbrit, Ignimbrite]
      en: [ignimbrite, ignimbrites]
      fr: [ignimbrite, ignimbrites]
      it: [ignimbrite, ignimbriti]

  Kakirite:
    description:
      Non-cohesive rock formed by tectonic fragmentation in a deformation
      zone. Distinct from Cataclastite, which results from the same
      process but is cohesive.
    keywords:
      de: [Kakirit, Kakirite]
      en: [kakirite, kakirites]
      fr: [kakirite, kakirites]
      it: [cachirite, cachiriti]

  Latite:
    description:
      Volcanic rock with max. 20% quartz or max. 10% feldspatoid and
      35-65% plagioclase in the QAPF diagram; the texture is microlithic
      to porphyric. Also called trachyandesite. Volcanic equivalent of
      Monzonite.
    keywords:
      de: [Latit, Latite, Trachyandesit]
      en: [latite, latites, trachyandesite]
      fr: [latite, latites, trachyandésite]
      it: [latite, latiti, trachiandesite]

  Limestone:
    description:
      Sedimentary rock essentially composed of the mineral calcite (pure
      calcium carbonate). It forms directly by biogenic, biochemical or
      hydrochemical processes, or indirectly by accumulation and
      cementation of calcitic clasts. Infer from facies wording such as
      "calcaire oolithique", "calcaire bioclastique" or "Kalk". Distinct
      from Dolostone, from Marlstone (carbonate-rich fine clastic rock)
      and from Marble (metamorphic).
    keywords:
      de: [Kalkstein, Kalksteine, Kalk]
      en: [limestone, limestones]
      fr: [calcaire, calcaires]
      it: [calcare, calcari]

  Marble:
    description:
      Metamorphic rock dominantly of carbonate composition, with a
      granoblastic texture and a massive to layered aspect. Foliated
      varieties are classified as calcschists or calcphyllites, so use
      Schist or Phyllite where a foliated carbonate rock is described.
    keywords:
      de: [Marmor]
      en: [marble, marbles]
      fr: [marbre, marbres]
      it: [marmo, marmi]

  Marlstone:
    description:
      Carbonate-rich fine-grained clastic sedimentary rock, mean
      grainsize 1/256 to 1/16 mm. Very common in Swiss sections as
      "Mergel" or "marne". Distinct from Siltstone (same grainsize range,
      not carbonate-rich), from Claystone (finer) and from Limestone.
      Beware adjectival use such as "mergeliger Kalk" or "calcaire
      marneux", which describes a component of another lithology.
    keywords:
      de: [Mergelstein, Mergelsteine, Mergel]
      en: [marlstone, marlstones, marl]
      fr: [marne, marnes]
      it: [marna, marne]

  Migmatite:
    description:
      Rock formed by partial fusion under medium- to high-grade
      metamorphic conditions, segregating a leucosome exsolution from a
      melanosome refractory remnant. This anatectic process can
      ultimately lead to the production of magmatic bodies. Assign over
      Gneiss or Granulite whenever partial melting or leucosome and
      melanosome segregation is described.
    keywords:
      de: [Migmatit, Migmatite]
      en: [migmatite, migmatites]
      fr: [migmatite, migmatites]
      it: [migmatite, migmatiti]

  Monzonite:
    description:
      Plutonic rock with max. 20% quartz or max. 10% feldspatoid and
      35-65% plagioclase in the QAPF diagram, between Syenite (less than
      35%) and Diorite (more than 65%). Volcanic equivalent is Latite.
    keywords:
      de: [Monzonit, Monzonite]
      en: [monzonite, monzonites]
      fr: [monzonite, monzonites]
      it: [monzonite, monzoniti]

  Mylonite:
    description:
      Rock formed by ductile tectonic deformation. Distinct from
      Cataclastite and Kakirite (brittle fragmentation) and from
      Pseudotachyllite (frictional melting) within the same deformation
      zones.
    keywords:
      de: [Mylonit, Mylonite]
      en: [mylonite, mylonites]
      fr: [mylonite, mylonites]
      it: [milonite, miloniti]

  Pegmatite:
    description:
      Filonian magmatic rock characterised by very large automorphic
      crystals, mainly occurring at the periphery of, and genetically
      linked to, granitic intrusions. Also called pegmatitic rock.
      Distinct from Aplite (microcrystalline) in the same setting.
    keywords:
      de: [Pegmatit, Pegmatite]
      en: [pegmatite, pegmatites, pegmatitic rock]
      fr: [pegmatite, pegmatites]
      it: [pegmatite, pegmatiti]

  Pelite:
    description:
      Fine-grained clastic sedimentary rock, mean grainsize below
      1/16 mm. Granulometric umbrella class covering the clay and silt
      grades — use it when the text reports only a fine-grained clastic
      rock, and prefer Claystone, Siltstone or Marlstone whenever the
      specific rock is named.
    keywords:
      de: [Pelit, Pelite]
      en: [pelite, pelites]
      fr: [pélite, pélites]
      it: [pelite, peliti]

  Peridotite:
    description:
      Coarse-grained ultramafic rock essentially composed of minerals of
      the olivine and pyroxene groups. Distinct from Pyroxenite (pyroxene
      group only) and from Serpentinite, its serpentinised metamorphic
      product.
    keywords:
      de: [Peridotit, Peridotite]
      en: [peridotite, peridotites]
      fr: [péridotite, péridotites]
      it: [peridotite, peridotiti]

  Phonolite:
    description:
      Undersaturated volcanic rock with no quartz, more than 10%
      feldspatoid and less than 50% plagioclase in the QAPF diagram; the
      texture is microlithic. Distinct from Tephrite (more than 50%
      plagioclase) and Foidite (more than 60% feldspatoid).
    keywords:
      de: [Phonolith, Phonolithe]
      en: [phonolite, phonolites]
      fr: [phonolite, phonolites]
      it: [fonolite, fonoliti]

  Phyllite:
    description:
      Finely foliated metamorphic rock, with cleavage planes less than
      0,1 mm apart — the finest member of the foliation series ahead of
      Schist (0,1-1 cm) and Gneiss (more than 1 cm). Foliated carbonate
      and quartz-rich varieties are named calcphyllites and quartz
      phyllites and belong here rather than under Marble or Quartzite.
    keywords:
      de: [Phyllit, Phyllite]
      en: [phyllite, phyllites]
      fr: [phyllite, phyllites]
      it: [fillite, filliti]

  Prasinite:
    description:
      Mafic metamorphic rock of basaltic composition, typically
      displaying white ocellar albite crystals surrounded by a green
      matrix. Lower-grade counterpart of Amphibolite from a comparable
      mafic protolith.
    keywords:
      de: [Prasinit, Prasinite]
      en: [prasinite, prasinites]
      fr: [prasinite, prasinites]
      it: [prasinite, prasiniti]

  Psammite:
    description:
      Medium-grained clastic sedimentary rock, mean grainsize 1/16 to
      2 mm. Granulometric umbrella class for the sand grade — use it when
      the text reports only a sand-grade clastic rock, and prefer
      Sandstone whenever that term or its equivalents are used.
    keywords:
      de: [Psammit, Psammite]
      en: [psammite, psammites]
      fr: [psammite, psammites]
      it: [psammite, psammiti]

  Psephite:
    description:
      Coarse-grained clastic sedimentary rock, mean grainsize above 2 mm,
      typically formed by pebbles in a finer-grained matrix.
      Granulometric umbrella class for the gravel grade — use it when the
      angularity of the components is not reported, and prefer
      Conglomerate (rounded) or Breccia (angular) when it is.
    keywords:
      de: [Psephit, Psephite]
      en: [psephite, psephites]
      fr: [pséphite, pséphites]
      it: [psefite, psefiti]

  Pseudotachyllite:
    description:
      Rock resulting from melting by frictional heat in a deformation
      zone, typically forming thin dark veins. Distinct from Cataclastite
      and Kakirite (fragmentation) and Mylonite (ductile flow).
    keywords:
      de: [Pseudotachyllit, Pseudotachylit]
      en: [pseudotachyllite, pseudotachylite, pseudotachylyte]
      fr: [pseudotachyllite, pseudotachylite]
      it: [pseudotachilite, pseudotachiliti]

  Pyroxenite:
    description:
      Coarse-grained ultramafic rock essentially composed of minerals of
      the pyroxene group. Distinct from Peridotite, which also carries
      abundant olivine.
    keywords:
      de: [Pyroxenit, Pyroxenite]
      en: [pyroxenite, pyroxenites]
      fr: [pyroxénite, pyroxénites]
      it: [pirossenite, pirosseniti]

  Quartzite:
    description:
      Metamorphic rock dominantly of quartzitic composition, with a
      granoblastic texture and a massive to layered aspect. Foliated
      varieties are classified as quartz schists or quartz phyllites, so
      use Schist or Phyllite where a foliated quartz-rich rock is
      described.
    keywords:
      de: [Quarzit, Quarzite]
      en: [quartzite, quartzites]
      fr: [quartzite, quartzites]
      it: [quarzite, quarziti]

  Rauwacke:
    description:
      Porous carbonate sedimentary rock with a brecciated and/or vacuolar
      aspect, formed by a combination of chemical processes (including
      dissolution of original gypsum) and/or tectonic deformation. Also
      called cellular dolostone; "cornieule" and "cargnola" in Alpine
      usage. Prefer this class over Breccia or Dolostone whenever the
      cellular, vacuolar character is described.
    keywords:
      de: [Rauwacke, Rauwacken, Zellendolomit]
      en: [rauwacke, rauwackes, cellular dolostone]
      fr: [cornieule, cornieules]
      it: [cargnola, cargnole]

  Rhyolite:
    description:
      Leucocratic acidic volcanic rock with more than 20% quartz and less
      than 65% plagioclase in the QAPF diagram; the texture is microlithic
      to porphyric with a large amount of glass. Volcanic equivalent of
      Granite; Dacite is the plagioclase-rich counterpart.
    keywords:
      de: [Rhyolith, Rhyolithe]
      en: [rhyolite, rhyolites]
      fr: [rhyolite, rhyolites]
      it: [riolite, rioliti]

  Rock:
    description:
      Generic class for a natural consolidated material made up of an
      assemblage of minerals or composite particles. Use only where the
      text records consolidated bedrock with no lithological detail, for
      example "Festgestein erreicht" or "roche en place". Always prefer a
      specific lithology when one is named or inferable. Distinct from
      Unconsolidated (loose material) and from Not specified (no
      lithological information at all).
    keywords:
      de: [Gestein, Festgestein]
      en: [rock, rocks, consolidated rock, stone, bedrock]
      fr: [roche, roche consolidée]
      it: [roccia, rocce]

  Rodingite:
    description:
      Calc-silicate-rich microcrystalline rock formed by metasomatic
      processes at the contact between serpentinites and mafic or felsic
      intrusive bodies. Expect it in association with Serpentinite.
    keywords:
      de: [Rodingit, Rodingite]
      en: [rodingite, rodingites]
      fr: [rodingite, rodingites]
      it: [rodingite, rodingiti]

  Sandstone:
    description:
      Medium-grained clastic sedimentary rock, mean grainsize 1/16 to
      2 mm. Prefer over Psammite whenever the term is used explicitly.
      Beware adjectival use such as "calcaire gréseux" or "sandiger
      Mergel", which describes a component of another lithology rather
      than sandstone itself.
    keywords:
      de: [Sandstein, Sandsteine]
      en: [sandstone, sandstones]
      fr: [grès]
      it: [arenaria, arenarie]

  Schist:
    description:
      Foliated metamorphic rock whose schistose cleavage planes lie 0,1
      to 1 cm apart, between Phyllite (finer) and Gneiss (more than
      1 cm). Calcschists and quartz schists belong here rather than under
      Marble or Quartzite. Note that German "Schiefer" is used loosely
      for several fissile rocks, so check whether the context indicates
      true schistose foliation.
    keywords:
      de: [Schiefer]
      en: [schist, schists]
      fr: [schiste, schistes]
      it: [scisto, scisti]

  Serpentinite:
    description:
      Metamorphic rock essentially composed of minerals of the serpentine
      group, derived from the hydration of ultramafic protoliths.
      Associated with Peridotite and Pyroxenite, and with Rodingite at
      intrusive contacts.
    keywords:
      de: [Serpentinit, Serpentinite]
      en: [serpentinite, serpentinites]
      fr: [serpentinite, serpentinites]
      it: [serpentinite, serpentiniti]

  Siltstone:
    description:
      Fine-grained clastic sedimentary rock, mean grainsize 1/256 to
      1/16 mm. Distinct from Claystone (finer) and from Marlstone (same
      range, carbonate-rich). Use Pelite when clay and silt grades are
      not distinguished.
    keywords:
      de: [Siltstein, Siltsteine]
      en: [siltstone, siltstones]
      fr: [siltite, siltites]
      it: [siltite, siltiti]

  Syenite:
    description:
      Plutonic rock with max. 20% quartz or max. 10% feldspatoid and less
      than 35% plagioclase in the QAPF diagram. Volcanic equivalent is
      Trachyte; Monzonite carries 35-65% plagioclase.
    keywords:
      de: [Syenit, Syenite]
      en: [syenite, syenites]
      fr: [syénite, syénites]
      it: [sienite, sieniti]

  Tephrite:
    description:
      Undersaturated volcanic rock with no quartz, more than 10%
      feldspatoid and more than 50% plagioclase in the QAPF diagram; the
      texture is microlithic. Distinct from Phonolite (less than 50%
      plagioclase) and closely related to Basanite, its olivine-rich
      counterpart.
    keywords:
      de: [Tephrit, Tephrite]
      en: [tephrite, tephrites]
      fr: [téphrite, téphrites]
      it: [tefrite, tefriti]

  Tonalite:
    description:
      Acidic plutonic rock with 20-60% quartz and more than 90%
      plagioclase in the QAPF diagram, the most plagioclase-rich member
      of the Granite to Granodiorite to Tonalite series.
    keywords:
      de: [Tonalit, Tonalite]
      en: [tonalite, tonalites]
      fr: [tonalite, tonalites]
      it: [tonalite, tonaliti]

  Trachyte:
    description:
      Volcanic rock with max. 20% quartz or max. 10% feldspatoid and less
      than 35% plagioclase in the QAPF diagram; the texture is microlithic
      to porphyric. Volcanic equivalent of Syenite.
    keywords:
      de: [Trachyt, Trachyte]
      en: [trachyte, trachytes]
      fr: [trachyte, trachytes]
      it: [trachite, trachiti]

  Tuffite:
    description:
      Volcano-clastic rock with a large proportion (25-75%) of elements of
      volcanic origin. Also called tuffitic rock. Distinct from Ignimbrite,
      where pyroclastic elements dominate (more than 75%).
    keywords:
      de: [Tuffit, Tuffite]
      en: [tuffite, tuffites, tuffitic rock]
      fr: [tuffite, tuffites]
      it: [tufite, tufiti]

  Unconsolidated:
    description:
      Any unconsolidated material such as clay, marl, silt, peat, sand,
      pebbles or loam. Use for Quaternary cover and other loose intervals
      where no bedrock lithology applies. Distinct from Rock, which
      denotes consolidated material without further lithological detail.
    keywords:
      de: [Lockergestein, Lockermaterial, unverfestigtes Material,
           unconsolidated material, Ton, Mergel, Silt, Torf, Sand, Kies,
           Gerölle, Lehm]
      en: [unconsolidated material, unconsolidated, clay, marl, silt,
           peat, sand, pebbles, gravel, loam]
      fr: [terrain meuble, matériaux meubles, unconsolidated material,
           argile, marne, silt, tourbe, sable, gravier, galets, limon]
      it: [materiale sciolto, materiale incoerente,
           unconsolidated material, argilla, marna, silt, torba, sabbia,
           ghiaia, ciottoli, limo]
