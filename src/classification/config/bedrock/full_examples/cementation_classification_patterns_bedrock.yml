baseline: |
  uncemented:
    description:
      Sediment or rock with no binding agent between grains or fragments;
      particles are loose and unbonded. The material disaggregates freely
      when handled. Typical of unconsolidated alluvial, glacial, or
      aeolian deposits with no diagenetic cementation.
    keywords:
      de: [nicht zementiert, unzementiert, locker, locker gelagert, sehr locker, lose, unverfestigt, kohäsionslos]
      fr: [non cimenté, non cimentée, non consolidé, meuble]
      it: [non cementato, non cementata, non consolidato, sciolto]

  weakly_cemented:
    description:
      Grains or fragments are loosely bonded by a small amount of cement;
      the material crumbles or breaks apart with little effort. Cohesion
      is present but minimal, and individual grains can be separated by
      hand. Common in partially diagenised or weathered sandstones and
      gravels.
    keywords:
      de: [schwach zementiert, schwach verfestigt, wenig zementiert, gering zementiert, mürb, mürbe, knapp zerdrückbar, verkittet]
      fr: [faiblement cimenté, faiblement cimentée, peu cimenté, légèrement cimenté, faiblement induré, faiblement indurée, peu induré, peu indurée, tendre]
      it: [debolmente cementato, debolmente cementata, poco cementato, leggermente cementato, friabile, tenero]

  moderately_cemented:
    description:
      Grains or fragments are bonded by a moderate amount of cement;
      the material requires tools to disaggregate but lacks the hardness
      of well-cemented rock. Intermediate diagenetic stage common in
      sandstones, siltstones, and calcareous conglomerates.
    keywords:
      de: [mässig zementiert, mittel zementiert, mittelmässig zementiert, mäßig verfestigt, mittelhart]
      fr: [modérément cimenté, modérément cimentée, moyennement cimenté]
      it: [moderatamente cementato, moderatamente cementata, mediamente cementato]

  well_cemented:
    description:
      Grains or fragments are firmly bonded throughout by abundant cement;
      the rock is coherent and resistant, requiring significant effort to
      break. Typical of well-diagenised sandstones, limestones, and
      conglomerates with siliceous, calcareous, or ferrigenous cement.
    keywords:
      de: [gut zementiert, fest zementiert, gut verfestigt, hart, nicht zerdrückbar, fest verkittet, festgelagert]
      fr: [bien cimenté, bien cimentée, solidement cimenté, induré, indurée, indurés, indurées]
      it: [ben cementato, ben cementata, solidamente cementato, indurito, indurita]

  strongly_cemented:
    description:
      Grains or fragments are very strongly bonded by a dense cement matrix;
      the rock is extremely hard and resistant, comparable to fresh crystalline
      rock. Breakage occurs through grains rather than around them. Characteristic
      of quartzite-like sandstones or rocks with intensive siliceous or iron-oxide
      cementation.
    keywords:
      de: [stark zementiert, sehr stark zementiert, sehr fest zementiert, intensiv zementiert, sehr hart, stark verkittet, sehr festgelagert]
      fr: [fortement cimenté, fortement cimentée, très fortement cimenté, très induré, très indurée, très dur, très dure, très durs, très dures]
      it: [fortemente cementato, fortemente cementata, molto fortemente cementato, intensamente cementato, molto duro, molto dura]

  other:
    description:
      Cementation state that does not fit any of the defined categories.
      Use only when a cementation degree is clearly described but genuinely
      falls outside the uncemented–strongly_cemented spectrum.
    keywords:
      de: [andere, sonstige, übrige]
      fr: [autre, autres]
      it: [altro, altri]

  not_specified:
    description:
      No cementation information is provided or inferable from the text.
      Use when the description is absent, illegible, or entirely ambiguous.
      Do not use as a fallback when cementation can be reasonably inferred.
    keywords:
      de: [keine Angabe, nicht angegeben, unbekannt, k.A.]
      fr: [sans indication, non spécifié, inconnu]
      it: [senza indicazioni, non specificato, sconosciuto]
